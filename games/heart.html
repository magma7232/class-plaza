:root{--ui:"Jua","Noto Sans KR","Apple SD Gothic Neo",sans-serif;--plum:#4a2550;--pink:#ff6fae;--deep:#d23d7c;--cream:#fff8fc;--sat:env(safe-area-inset-top,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#bfe0ff;font-family:var(--ui);color:var(--plum);touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
#app{position:fixed;inset:0;overflow:hidden}
#cv{position:absolute;left:0;top:0;display:block}
#joy{position:absolute;inset:0;z-index:1}
.hide{display:none!important}
button{font-family:var(--ui);color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
img{-webkit-user-drag:none}

/* 버튼 */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 30px;border-radius:999px;font-size:22px;color:#fff;letter-spacing:.5px;text-shadow:0 2px 0 rgba(140,30,80,.55);background:linear-gradient(#ffa3cd,#ff6aa8 55%,#f2508f);border:4px solid #fff;box-shadow:0 6px 0 #c33a76,0 10px 18px rgba(120,30,80,.35),inset 0 -4px 0 rgba(180,40,100,.25);transition:transform .08s,box-shadow .08s}
.btn::before{content:"";position:absolute;left:14%;right:14%;top:5px;height:36%;border-radius:999px;background:linear-gradient(rgba(255,255,255,.75),rgba(255,255,255,.1))}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #c33a76,0 4px 10px rgba(120,30,80,.3)}
.btn.big{min-height:66px;font-size:28px;padding:0 44px}
.btn.small{min-height:46px;font-size:18px;padding:0 22px}
.btn.mint{background:linear-gradient(#9ff0d6,#4fd3a8 55%,#33bb90);box-shadow:0 6px 0 #22936f,0 10px 18px rgba(20,90,70,.3);text-shadow:0 2px 0 rgba(20,100,70,.55)}
.btn.mint:active{box-shadow:0 1px 0 #22936f}
.btn.purple{background:linear-gradient(#d4b8ff,#a37cf5 55%,#8a5ee8);box-shadow:0 6px 0 #6540c0,0 10px 18px rgba(60,30,120,.3);text-shadow:0 2px 0 rgba(60,30,120,.55)}
.btn.gold{background:linear-gradient(#ffe89a,#ffc93a 55%,#f3ab1c);box-shadow:0 6px 0 #c07e00,0 10px 18px rgba(120,80,0,.3);text-shadow:0 2px 0 rgba(140,80,0,.55)}
.btn.gray{background:linear-gradient(#e9e2f2,#c4b8d6 55%,#ad9fc4);box-shadow:0 6px 0 #8a7aa6,0 10px 18px rgba(60,40,90,.25);text-shadow:0 2px 0 rgba(80,60,110,.5)}
.btn.gray:active,.btn.purple:active,.btn.gold:active{box-shadow:0 1px 0 rgba(0,0,0,.2)}
.panel{background:linear-gradient(#fffcfe,#ffeef7);border:4px solid #fff;border-radius:24px;box-shadow:0 6px 0 rgba(200,90,150,.35),0 14px 30px rgba(80,30,90,.28)}

/* 상태판 */
#hud{position:absolute;inset:0;z-index:5;pointer-events:none}
#hud button{pointer-events:auto}
#me{position:absolute;left:calc(12px + var(--sal));top:calc(10px + var(--sat));display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;width:300px;border-radius:22px}
#me .pt{flex:none;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,#ffd6e8 70%,#ffb5d3);border:3px solid #fff;box-shadow:0 0 0 3px #ffb3d3,inset 0 -4px 8px rgba(255,120,170,.35);display:flex;align-items:center;justify-content:center;overflow:hidden}
#me .pt img{width:118%;margin-top:6px}
#me .mi{flex:1;min-width:0}
#me .nm{display:flex;align-items:baseline;gap:6px;font-size:20px;margin:0 2px 4px;white-space:nowrap}
#me .nm small{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:13px;color:#a07aa8}
#meName{max-width:130px;overflow:hidden;text-overflow:ellipsis;font-family:var(--ui),"Noto Sans KR","Noto Sans CJK KR",sans-serif}
.lvb{font-size:16px;color:#fff;background:linear-gradient(#ffd56b,#f4a91d);padding:1px 10px;border-radius:999px;text-shadow:0 1px 0 rgba(140,80,0,.6);box-shadow:0 2px 0 #c4820a}
.lvb b{font-weight:normal}
.bar{position:relative;height:18px;border-radius:12px;background:rgba(80,30,90,.32);border:3px solid #fff;box-shadow:0 2px 0 rgba(120,40,100,.25);overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:100%;border-radius:9px;transition:width .2s ease-out}
.bar i::after{content:"";position:absolute;left:4px;right:4px;top:2px;height:35%;border-radius:9px;background:rgba(255,255,255,.55)}
.bar.hp i{background:linear-gradient(#ffa5cc,#ff4f8b 60%,#e23a75)}
.bar em{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:13px;color:#fff;text-shadow:0 1px 0 #7a1840,0 0 3px #7a1840}
.bar.xp{height:12px;margin-top:4px}
.bar.xp i{background:linear-gradient(#fff4b0,#ffc83a 60%,#f1a51a)}
#me.low .pt{animation:lowhp .6s infinite alternate}
@keyframes lowhp{to{box-shadow:0 0 0 5px #ff4f6e,0 0 18px #ff4f6e}}
#skills{position:absolute;left:calc(14px + var(--sal));top:calc(104px + var(--sat));display:flex;flex-wrap:wrap;gap:6px;width:300px}
.sk{position:relative;width:42px;height:42px;filter:drop-shadow(0 3px 0 rgba(120,40,100,.25))}
.sk img{width:100%;height:100%}
.sk b{position:absolute;right:-4px;bottom:-4px;min-width:19px;height:19px;padding:0 4px;border-radius:10px;background:#7a3a8a;color:#fff;font-weight:normal;font-size:13px;line-height:15px;text-align:center;border:2px solid #fff}
.sk.p b{background:#2c9a74}
#stage{position:absolute;left:50%;top:calc(10px + var(--sat));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;min-width:300px}
.pill{display:flex;align-items:center;gap:10px;padding:4px 8px 4px 18px;border-radius:999px;background:linear-gradient(#fff,#ffeaf4);border:4px solid #fff;box-shadow:0 5px 0 rgba(200,90,150,.35),0 10px 20px rgba(80,30,90,.22)}
.pill b{font-weight:normal;font-size:22px;color:var(--deep)}
.pill span{min-width:64px;padding:2px 12px;border-radius:999px;background:#4a2550;color:#fff;font-size:20px;text-align:center}
.pill span:empty{display:none}
.pill span.hurry{background:#ff4f6e;animation:hurry .5s infinite alternate}
@keyframes hurry{to{transform:scale(1.1)}}
#stMsg{font-size:17px;color:#fff;text-shadow:0 2px 0 #7a3a8a,0 0 6px rgba(90,30,110,.8)}
#bossBar{width:min(520px,60vw);margin-top:2px}
#bossBar .bn{text-align:center;font-size:20px;color:#fff;text-shadow:0 2px 0 #5a1d70,0 0 6px rgba(90,30,110,.9);margin-bottom:2px}
.bar.boss{height:22px;border-width:4px}
.bar.boss i{background:linear-gradient(#d8b6ff,#9b5cf0 60%,#7c3fd8)}
#bossBar.weak .bar.boss i{background:linear-gradient(#ffd0e4,#ff5f9e 60%,#e4407f);animation:weak .25s infinite alternate}
@keyframes weak{to{filter:brightness(1.3)}}
#tr{position:absolute;right:calc(12px + var(--sar));top:calc(10px + var(--sat));display:flex;gap:10px}
.ib{width:54px;height:54px;border-radius:50%;color:#fff;background:linear-gradient(#ffa3cd,#ff6aa8);border:4px solid #fff;box-shadow:0 5px 0 #c33a76,0 8px 16px rgba(120,30,80,.3);display:flex;align-items:center;justify-content:center}
.ib:active{transform:translateY(4px);box-shadow:0 1px 0 #c33a76}
.ib svg{width:30px;height:30px}
.ib .x{display:none}
.ib.off .x{display:block}.ib.off .w{display:none}
#friends{position:absolute;right:calc(12px + var(--sar));top:calc(78px + var(--sat));display:flex;flex-direction:column;gap:6px}
.fr{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:16px;background:rgba(255,255,255,.82);border:3px solid #fff;box-shadow:0 3px 0 rgba(200,90,150,.3)}
.fr img{width:38px;height:38px;object-fit:contain;border-radius:50%;background:#ffe9f3}
.fr span{display:block;font-size:14px;line-height:1.1;white-space:nowrap;font-family:var(--ui),"Noto Sans KR","Noto Sans CJK KR",sans-serif}
.fr span small{margin-left:4px;font-size:11px;color:#9a7aa4}
.bar.fhp{width:92px;height:11px;border-width:2px}
.bar.fhp i{background:linear-gradient(#a2f0c4,#3fcf8b)}
.fr.down{opacity:.65}.fr.down img{filter:grayscale(1)}
#kills{position:absolute;right:calc(14px + var(--sar));bottom:calc(12px + var(--sab));display:flex;align-items:center;gap:6px;padding:6px 16px 6px 10px;border-radius:999px;background:rgba(255,255,255,.85);border:3px solid #fff;box-shadow:0 4px 0 rgba(200,90,150,.3);font-size:17px}
#kills svg{width:24px;height:24px}
#kills b{font-weight:normal;font-size:22px;color:var(--deep);min-width:30px}
#show{position:absolute;left:50%;bottom:calc(14px + var(--sab));transform:translateX(-50%);z-index:6;display:flex;flex-wrap:wrap;justify-content:center;gap:10px;width:min(96vw,900px)}
#hurt{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,rgba(255,80,120,0) 55%,rgba(255,60,110,.45))}
#hurt.in{animation:hurt .45s ease-out}
@keyframes hurt{0%{opacity:1}100%{opacity:0}}

/* 큰 알림 */
#banner{position:absolute;left:0;right:0;top:24%;z-index:7;pointer-events:none;text-align:center;opacity:0;transform:scale(.6)}
#banner.in{animation:bin .5s cubic-bezier(.2,1.6,.4,1) forwards}
#banner:not(.in){transition:opacity .35s,transform .35s}
@keyframes bin{0%{opacity:0;transform:scale(.4) rotate(-6deg)}100%{opacity:1;transform:scale(1)}}
#bn1{display:inline-block;font-size:clamp(40px,8vw,74px);color:#fff;letter-spacing:2px;padding:4px 34px;-webkit-text-stroke:0;text-shadow:0 4px 0 #c33a76,0 8px 0 rgba(120,30,80,.35),3px 3px 0 #c33a76,-3px 3px 0 #c33a76,3px -3px 0 #c33a76,-3px -3px 0 #c33a76,0 0 30px rgba(255,120,180,.9)}
#bn2{margin-top:8px;font-size:clamp(17px,2.6vw,24px);color:#fff;text-shadow:0 2px 0 #7a3a8a,0 0 8px rgba(90,30,110,.85)}

<script>/* ---- util.js ---- */
/* 공통 도우미 · 조이스틱 */
const $ = (s, r) => (r || document).querySelector(s);
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const rint = (n) => Math.floor(Math.random() * n);
const pick = (a) => a[rint(a.length)];
const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = rint(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const d2 = (a, b) => { const dx = a.x - b.x, dy = a.y - b.y; return dx * dx + dy * dy; };
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const mmss = (ms) => { const s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const outBack = (t) => { const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const outCubic = (t) => 1 - Math.pow(1 - t, 3);
function seeded(seed) { let s = seed >>> 0 || 1; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }

// 손가락이 닿은 곳이 조이스틱 중심이 되고, 민 방향으로 움직인다
const Input = {
  keys: {}, joy: { on: false, id: -1, ox: 0, oy: 0, x: 0, y: 0 }, R: 54,
  init() {
    const typing = (e) => e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName);
    addEventListener('keydown', (e) => { if (typing(e)) return; this.keys[e.code] = true; if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault(); });
    addEventListener('keyup', (e) => { this.keys[e.code] = false; });
    addEventListener('blur', () => { this.keys = {}; this.joy.on = false; this.joy.x = this.joy.y = 0; });
  },
  bind(zone) {
    const j = this.joy, R = this.R;
    zone.addEventListener('pointerdown', (e) => { if (j.on) return; j.on = true; j.id = e.pointerId; j.ox = e.clientX; j.oy = e.clientY; j.x = j.y = 0; try { zone.setPointerCapture(e.pointerId); } catch (x) { /* */ } e.preventDefault(); });
    zone.addEventListener('pointermove', (e) => { if (!j.on || e.pointerId !== j.id) return; let dx = e.clientX - j.ox, dy = e.clientY - j.oy; const d = Math.hypot(dx, dy); if (d > R) { j.ox += dx * (1 - R / d); j.oy += dy * (1 - R / d); dx *= R / d; dy *= R / d; } j.x = dx / R; j.y = dy / R; });
    const up = (e) => { if (e.pointerId === j.id) { j.on = false; j.x = j.y = 0; } };
    zone.addEventListener('pointerup', up); zone.addEventListener('pointercancel', up); zone.addEventListener('lostpointercapture', up);
    zone.addEventListener('contextmenu', (e) => e.preventDefault());
  },
  dir(out) {
    const k = this.keys; const x = (k.ArrowRight || k.KeyD ? 1 : 0) - (k.ArrowLeft || k.KeyA ? 1 : 0), y = (k.ArrowDown || k.KeyS ? 1 : 0) - (k.ArrowUp || k.KeyW ? 1 : 0);
    if (x || y) { const l = Math.hypot(x, y); out.x = x / l; out.y = y / l; return out; }
    const j = this.joy, l = Math.hypot(j.x, j.y); if (!j.on || l < 0.16) { out.x = out.y = 0; return out; }
    const m = Math.min(1, (l - 0.1) / 0.45); out.x = j.x / l * m; out.y = j.y / l * m; return out;
  },
};

/* ---- audio.js ---- */
/* 소리: 오르골 느낌의 합성음 (외부 파일 없음) */
const Snd = {
  ctx: null, out: null, mus: null, fxg: null, muted: false, cur: '', step: 0, nextT: 0, timer: 0, combo: 0, comboT: 0, last: {},
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    const c = this.ctx = new AC(); this.out = c.createGain(); this.out.gain.value = this.muted ? 0 : 0.8; this.out.connect(c.destination);
    this.mus = c.createGain(); this.mus.gain.value = 0.32; this.mus.connect(this.out);
    this.fxg = c.createGain(); this.fxg.gain.value = 0.9; this.fxg.connect(this.out);
    const n = c.createBuffer(1, c.sampleRate * 0.5, c.sampleRate), d = n.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; this.nbuf = n;
    if (this.want) this.music(this.want);
  },
  mute(m) { this.muted = m; if (this.out) this.out.gain.value = m ? 0 : 0.8; if (window.BGM) BGM.mute(m); },
  osc(t, f, dur, type, vol, dst, f2, att) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    const a = att || 0.004; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dst || this.fxg); o.start(t); o.stop(t + dur + 0.02);
  },
  bell(t, f, dur, vol, dst) { this.osc(t, f, dur, 'sine', vol, dst); this.osc(t, f * 2.01, dur * 0.55, 'sine', vol * 0.35, dst); this.osc(t, f * 3.98, dur * 0.25, 'triangle', vol * 0.1, dst); },
  noise(t, dur, vol, freq, q, dst, f2) {
    const c = this.ctx, s = c.createBufferSource(), fl = c.createBiquadFilter(), g = c.createGain(); s.buffer = this.nbuf; fl.type = 'bandpass'; fl.frequency.setValueAtTime(freq, t); if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + dur); fl.Q.value = q || 1;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); s.connect(fl); fl.connect(g); g.connect(dst || this.fxg); s.start(t); s.stop(t + dur + 0.02);
  },
  hz: (m) => 440 * Math.pow(2, (m - 69) / 12),
  sfx(name, vol) {
    if (!this.ctx || this.muted) return; const t = this.ctx.currentTime, v = vol == null ? 1 : vol, H = this.hz;
    const gap = { arrow: 0.05, pop: 0.03, hit: 0.03, cheer: 0.045, gem: 0.025, note: 0.12, zap: 0.08, whoosh: 0.1, plane: 0.12, boom: 0.06 }[name];
    if (gap) { if (t - (this.last[name] || 0) < gap) return; this.last[name] = t; }
    switch (name) {
      case 'click': this.osc(t, 880, 0.06, 'sine', 0.12 * v, 0, 1320); break;
      case 'arrow': this.osc(t, 1050 + Math.random() * 200, 0.07, 'sine', 0.05 * v, 0, 1900); break;
      case 'pop': this.osc(t, 520 + Math.random() * 260, 0.07, 'sine', 0.09 * v, 0, 220); this.noise(t, 0.04, 0.05 * v, 2400, 2); break;
      case 'hit': this.osc(t, 240, 0.06, 'triangle', 0.06 * v, 0, 120); break;
      case 'cheer': { const b = 84 + rint(3) * 2; this.bell(t, H(b), 0.18, 0.05 * v); this.bell(t + 0.05, H(b + 4), 0.2, 0.04 * v); break; }
      case 'gem': { if (t - this.comboT > 0.6) this.combo = 0; this.comboT = t; const L = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24]; const m = 79 + L[Math.min(L.length - 1, this.combo++)]; this.bell(t, H(m), 0.22, 0.055 * v); break; }
      case 'lvl': [72, 76, 79, 84, 88].forEach((m, i) => this.bell(t + i * 0.07, H(m), 0.5, 0.09 * v)); break;
      case 'ok': [79, 84, 88].forEach((m, i) => this.bell(t + i * 0.08, H(m), 0.45, 0.1 * v)); break;
      case 'no': this.osc(t, 330, 0.18, 'triangle', 0.1 * v, 0, 220); this.osc(t + 0.15, 247, 0.25, 'triangle', 0.09 * v, 0, 165); break;
      case 'card': [88, 91, 96, 100, 103].forEach((m, i) => this.bell(t + i * 0.05, H(m), 0.4, 0.06 * v)); break;
      case 'boom': this.noise(t, 0.35, 0.22 * v, 900, 0.8, 0, 200); for (let i = 0; i < 5; i++) this.noise(t + 0.08 + i * 0.05 + Math.random() * 0.04, 0.04, 0.06 * v, 3000 + Math.random() * 3000, 3); this.bell(t, H(96), 0.25, 0.03 * v); break;
      case 'note': [76, 79, 83].forEach((m, i) => this.bell(t + i * 0.03, H(m + rint(2) * 2), 0.5, 0.05 * v)); break;
      case 'zap': this.osc(t, 1200, 0.18, 'sine', 0.05 * v, 0, 2600); this.osc(t + 0.03, 1800, 0.16, 'sine', 0.03 * v, 0, 3600); break;
      case 'whoosh': this.noise(t, 0.22, 0.07 * v, 600, 1.2, 0, 2200); break;
      case 'plane': this.noise(t, 0.18, 0.05 * v, 1500, 2, 0, 3500); break;
      case 'hurt': this.osc(t, 320, 0.16, 'triangle', 0.13 * v, 0, 150); this.noise(t, 0.06, 0.08 * v, 1200, 1); break;
      case 'down': [76, 72, 67, 60].forEach((m, i) => this.osc(t + i * 0.09, H(m), 0.2, 'triangle', 0.09 * v)); break;
      case 'revive': [72, 76, 79, 84, 91].forEach((m, i) => this.bell(t + i * 0.05, H(m), 0.3, 0.07 * v)); break;
      case 'warn': for (let i = 0; i < 3; i++) { this.osc(t + i * 0.24, 880, 0.12, 'square', 0.03 * v); this.osc(t + i * 0.24 + 0.12, 660, 0.12, 'square', 0.03 * v); } break;
      case 'tele': this.bell(t, H(93), 0.3, 0.06 * v); this.bell(t + 0.1, H(93), 0.3, 0.05 * v); break;
      case 'bell': for (let i = 0; i < 8; i++) this.bell(t + i * 0.045, H(i % 2 ? 98 : 101), 0.12, 0.05 * v); break;
      case 'stomp': this.osc(t, 110, 0.4, 'sine', 0.3 * v, 0, 45); this.noise(t, 0.25, 0.15 * v, 300, 0.7); break;
      case 'boss': this.osc(t, 70, 1.2, 'sine', 0.3 * v, 0, 45); [57, 60, 64, 69].forEach((m, i) => this.osc(t + 0.2 + i * 0.12, H(m), 0.5, 'triangle', 0.07 * v)); break;
      case 'clear': [72, 76, 79, 84, 79, 84, 88].forEach((m, i) => this.bell(t + i * 0.1, H(m), 0.6, 0.1 * v)); break;
      case 'chest': [84, 88, 91, 96, 100].forEach((m, i) => this.bell(t + i * 0.04, H(m), 0.5, 0.07 * v)); this.noise(t, 0.2, 0.05 * v, 5000, 2); break;
      case 'ult': [60, 64, 67, 72, 76, 79, 84].forEach((m, i) => this.bell(t + i * 0.03, H(m), 1.0, 0.07 * v)); this.noise(t, 0.6, 0.12 * v, 1500, 0.6, 0, 300); break;
      case 'go': this.bell(t, H(84), 0.5, 0.12 * v); this.bell(t + 0.08, H(91), 0.6, 0.1 * v); break;
      case 'beep': this.bell(t, H(81), 0.2, 0.08 * v); break;
      case 'heal': [79, 84, 88].forEach((m, i) => this.bell(t + i * 0.05, H(m), 0.35, 0.06 * v)); break;
      case 'spring': this.osc(t, 300, 0.25, 'sine', 0.08 * v, 0, 900); break;
      case 'trans': for (let i = 0; i < 10; i++) this.bell(t + i * 0.06, H(84 + [0, 4, 7, 11, 12, 16, 19, 23, 24, 28][i]), 0.6, 0.06 * v); break;
    }
  },
  // 배경 음악: 16칸 반복, 미리 0.15초씩 예약
  SONGS: {
    title: { bpm: 92, root: 72, mel: [0, -1, 7, -1, 4, -1, 7, 9, 12, -1, 9, -1, 7, -1, 4, -1, 2, -1, 4, -1, 7, -1, 4, 2, 0, -1, -1, -1, -5, -1, -1, -1], bass: [48, 55, 53, 55], soft: 1 },
    field: { bpm: 116, root: 72, mel: [0, 4, 7, 12, 11, 7, 4, 7, 9, 12, 16, 12, 9, 7, 4, -1, 5, 9, 12, 17, 16, 12, 9, 12, 14, 11, 7, 11, 12, -1, 7, -1], bass: [48, 53, 55, 48], hat: 1 },
    boss: { bpm: 138, root: 69, mel: [0, 3, 7, 3, 10, 7, 3, 7, 0, 3, 7, 12, 10, 7, 5, 3, -2, 2, 5, 2, 9, 5, 2, 5, 7, 10, 14, 10, 12, 7, 3, -1], bass: [45, 41, 43, 40], hat: 1, kick: 1 },
  },

    last = performance.now(); requestAnimationFrame(frame);
    window.GG = Game.G; window.__net = Net; window.__ready = true;
  }
  function startDirect(hero) { const b = document.querySelector(`.hcard[data-id="${hero}"]`); if (b) b.click(); document.getElementById('selGo').click(); }
  return { boot, title, Q, get rs() { return rs; }, get q() { return qLvl; }, get pL() { return pL; } };
})();
window.addEventListener('load', () => Main.boot());
</script>
<script>
/* 광장에서 고른 동물로 '나' 그리기 (heart_inject.py). 그림이 준비되면 window.ME2D = {c,w,h,ax,ay,top} */
(function () {
  var q = new URLSearchParams(location.search), id = q.get('char');
  if (!id || !/^[a-z0-9_]+$/.test(id)) return;
  var wear = (q.get('wear') || '').split(',').filter(Boolean);
  var sc = document.createElement('script');
  sc.src = '../chars/' + id + '_2d.js' + (/^http/.test(location.protocol) ? '?h=' + Math.floor(Date.now() / 3.6e6) : '');
  sc.onload = function () {
    var D = (window.CHAR2D || {})[id];
    if (!D || !D.base) return;
    var its = wear.map(function (w) { return D.items[w]; }).filter(Boolean);
    // 그리는 순서: 등(몸 뒤) → 몸 → 등 아이템의 몸 앞 부분(망토 목깃) → 바지 → 신발 → 윗옷 → 멜빵바지 가슴판(over) → 팔찌 → 목 → 얼굴 → 머리 → 손
    // (2026-11-19 옷 자리 4곳 더함: 긴 바지 끝은 장화 속으로, 윗옷 밑단은 바지 허리 위로, 멜빵은 윗옷 위로 — 3D와 같게)
    var layers = its.filter(function (i) { return i.behind; }).concat([D.base]);
    its.forEach(function (i) { if (i.behind && i.front) layers.push(i.front); });
    ['pants', 'shoes', 'top', 'over', 'wrist', 'neck', 'face', 'head', 'hand'].forEach(function (sl) { its.forEach(function (i) { if (sl === 'over') { if (i.over) layers.push(i.over); } else if (!i.behind && i.slot === sl) layers.push(i); }); });
    var left = layers.length, imgs = layers.map(function (L) {
      var im = new Image(); im.onload = im.onerror = function () { if (--left === 0) done(); }; im.src = L.img; return im;
    });
    function done() {
      var c = document.createElement('canvas'); c.width = D.W; c.height = D.H;
      var g = c.getContext('2d');
      layers.forEach(function (L, k) { if (imgs[k].naturalWidth) g.drawImage(imgs[k], L.x, L.y); });
      // 이름표·얼굴 사진 자리: 몸과 머리 아이템의 맨 위만(풍선 같은 손 아이템까지 세면 이름표가 너무 높이 뜸 — 검토에서 찾음)
      var top = D.base.y;
      layers.forEach(function (L) { if (L.slot === 'head' && L.y < top) top = L.y; });
      var k = 70 / D.ppu;   // 키 1 → 70칸(원래 하트 친구들과 비슷한 크기)
      // 얼굴 사진(상태창·퀴즈 창의 '나'): 맨 위(모자 포함)부터 목 조금 아래까지 정사각형
      var pc = document.createElement('canvas'), y0 = Math.max(0, top - 2), sz = Math.max(20, (D.ny || D.fy * 0.55) + 8 - y0);
      pc.width = pc.height = 96; pc.getContext('2d').drawImage(c, D.fx - sz / 2, y0, sz, sz, 0, 0, 96, 96);
      window.ME2D = { c: c, w: D.W * k, h: D.H * k, ax: D.fx * k, ay: D.fy * k, top: (D.fy - top) * k + 4, pt: pc.toDataURL() };
      var el = document.getElementById('mePt'); if (el) el.src = window.ME2D.pt;
    }
  };
  document.head.appendChild(sc);
})();
</script>
<script src="back.js" data-pos="left-middle"></script>
