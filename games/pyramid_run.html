<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>피라미드 대탈출 · 달리기</title>
<style>
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#4a3324;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;color:#3d2a1a}
#c{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;cursor:pointer;outline:none;-webkit-appearance:none;border:0;color:inherit;background:none;padding:0}
.card{background:rgba(255,248,232,.95);box-shadow:0 4px 16px rgba(60,30,10,.3)}
#vig{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,rgba(255,200,120,0) 52%,rgba(60,25,5,.42) 100%)}
#danger{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;opacity:0;background:radial-gradient(ellipse at 50% 42%,rgba(255,80,40,0) 45%,rgba(255,70,40,.55) 100%)}
#hud{position:fixed;left:0;top:0;width:100%;pointer-events:none}
#hCoinBox{position:fixed;left:calc(12px + env(safe-area-inset-left));top:calc(12px + env(safe-area-inset-top));height:48px;padding:0 18px 0 12px;border-radius:999px;display:flex;align-items:center;gap:8px;font-size:24px;font-weight:900;font-variant-numeric:tabular-nums}
#hCoinBox i{display:inline-block;width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3a8,#ffc933 55%,#e8a317);box-shadow:inset 0 0 0 2px #ffe066}
#hDistBox{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));transform:translateX(-50%);text-align:center;color:#fff;text-shadow:0 3px 0 rgba(90,45,10,.8),0 6px 16px rgba(0,0,0,.35)}
#hDist{font-size:40px;font-weight:900;line-height:1.05;font-variant-numeric:tabular-nums}
#hBest{font-size:14px;font-weight:800;opacity:.9}
#hPow{position:fixed;left:calc(12px + env(safe-area-inset-left));top:calc(68px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:6px}
.pw{display:flex;align-items:center;gap:6px;background:rgba(255,248,232,.92);border-radius:999px;padding:4px 10px 4px 6px;box-shadow:0 3px 10px rgba(60,30,10,.25)}
.pw b{font-size:20px;min-width:26px;text-align:center}
.pw i{display:block;width:64px;height:9px;border-radius:5px;background:#eadbc0;overflow:hidden}
.pw u{display:block;height:100%;background:linear-gradient(90deg,#ff8fab,#ffc933);transform-origin:left center}
#topR{position:fixed;right:calc(12px + env(safe-area-inset-right));top:calc(12px + env(safe-area-inset-top));display:flex;gap:8px;pointer-events:auto}
#topR button{width:52px;height:52px;border-radius:50%;font-size:22px}
#banner{position:fixed;left:50%;top:calc(92px + env(safe-area-inset-top));transform:translateX(-50%);width:min(560px,calc(100vw - 32px));padding:10px 16px 12px;border-radius:20px;text-align:center;pointer-events:none}
#banner.pop{animation:bpop .45s ease-out}
@keyframes bpop{0%{transform:translateX(-50%) scale(.6);opacity:0}60%{transform:translateX(-50%) scale(1.05);opacity:1}100%{transform:translateX(-50%) scale(1)}}
#bTop{font-size:13px;font-weight:900;color:#d9480f;letter-spacing:.3px}
#bText{font-size:23px;font-weight:900;line-height:1.3;margin-top:2px;word-break:keep-all}
#bSub{font-size:14px;font-weight:700;color:#7a5a3a;margin-top:4px;word-break:keep-all;line-height:1.45}
#big{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-size:64px;font-weight:900;color:#fff;pointer-events:none;white-space:nowrap}
#big.pop{animation:pop .7s ease-out}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}25%{transform:translate(-50%,-50%) scale(1.15);opacity:1}45%{transform:translate(-50%,-50%) scale(1)}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
#say{position:fixed;left:0;top:0;padding:6px 12px;background:#fff;border-radius:16px;font-size:17px;font-weight:900;color:#3b2b1f;box-shadow:0 3px 10px rgba(60,30,10,.25);white-space:nowrap;pointer-events:none;will-change:transform}
#say:after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-top-color:#fff;border-bottom:0}
#hint{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:10px;pointer-events:none}
#hint div{background:rgba(255,248,232,.93);border-radius:16px;padding:9px 14px;font-size:16px;font-weight:900;text-align:center;line-height:1.3;box-shadow:0 3px 12px rgba(60,30,10,.25)}
#hint div b{display:block;font-size:26px}
#reveal{position:fixed;left:50%;top:calc(150px + env(safe-area-inset-top));transform:translateX(-50%);min-width:260px;max-width:min(420px,90vw);padding:12px 18px;border-radius:22px;text-align:center;pointer-events:none}
#reveal.spin #rvIcon{animation:shake .12s linear infinite}
#reveal.got{animation:bpop2 .4s ease-out}
#reveal.l{box-shadow:0 0 0 4px #ffd43b,0 6px 24px rgba(240,140,0,.5)}
#reveal.r{box-shadow:0 0 0 4px #e599f7,0 6px 24px rgba(174,62,201,.4)}
@keyframes bpop2{0%{transform:translateX(-50%) scale(.7)}60%{transform:translateX(-50%) scale(1.08)}100%{transform:translateX(-50%) scale(1)}}
@keyframes shake{0%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}100%{transform:rotate(-8deg)}}
#rvIcon{font-size:46px;line-height:1.1;display:inline-block}
#rvName{font-size:20px;font-weight:900;margin-top:2px;word-break:keep-all}
#rvSub{font-size:14px;font-weight:700;color:#7a5a3a;margin-top:2px;word-break:keep-all}
#skip{position:fixed;right:calc(14px + env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));padding:12px 20px;border-radius:999px;font-size:17px;font-weight:900}
#title{z-index:20;position:fixed;left:0;top:0;width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;padding:0 0 0 calc(4vw + env(safe-area-inset-left));box-sizing:border-box;pointer-events:none}
#tBox{pointer-events:auto;width:min(430px,92vw);border-radius:28px;padding:22px 22px 18px;text-align:center}
#tBox h1{margin:0;font-size:34px;line-height:1.15;color:#c2410c;text-shadow:0 2px 0 #ffe8cc}
#tBox h1 small{display:block;font-size:16px;color:#7a5a3a;margin-top:4px;text-shadow:none}
#tBox p{margin:10px 0 14px;font-size:15px;color:#6b4c2e;line-height:1.55;font-weight:700;word-break:keep-all}
#chars{display:flex;gap:10px;margin-bottom:12px}
.ch{flex:1;border-radius:18px;background:#f4e6cc;padding:10px 6px;font-size:34px;line-height:1.1;box-shadow:inset 0 0 0 3px transparent;transition:transform .1s}
.ch b{display:block;font-size:16px;margin-top:4px}
.ch.on{background:#ffe3ec;box-shadow:inset 0 0 0 3px #ff6b9a}
.ch:active,#bGo:active,.row2 button:active,.cl:active{transform:scale(.96)}
#bGo{display:block;width:100%;border-radius:999px;padding:16px;font-size:21px;font-weight:900;background:linear-gradient(180deg,#ff8f5a,#f0592b);color:#fff;box-shadow:0 4px 0 #b9441c}
.row2{display:flex;gap:8px;margin-top:10px}
.row2 button{flex:1;border-radius:999px;padding:12px;font-size:16px;font-weight:900;background:#f4e6cc}
.row2 button#mSound{flex:0 0 56px}
#tStats{margin-top:12px;font-size:14px;font-weight:700;color:#7a5a3a}
#closet{z-index:30;position:fixed;left:0;top:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:rgba(40,20,5,.45)}
#clBox{width:min(640px,94vw);max-height:90vh;overflow-y:auto;border-radius:26px;padding:18px;box-sizing:border-box;text-align:center;touch-action:pan-y}
#clBox h2{margin:0 0 4px;font-size:24px}
#clInfo{font-size:13px;font-weight:700;color:#7a5a3a;margin-bottom:12px;word-break:keep-all}
#clGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.clSlot{grid-column:1/-1;font-weight:800;color:#8a5a2b;font-size:15px;margin:6px 2px 0}
#prog{position:fixed;left:50%;top:calc(4px + env(safe-area-inset-top));transform:translateX(-50%);width:min(56vw,520px);height:8px;border-radius:6px;background:rgba(255,255,255,.55);box-shadow:0 1px 4px rgba(90,45,10,.25)}
#progFill{height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,#ffd43b,#69db7c)}
#prog i{position:absolute;top:-2px;width:3px;height:12px;border-radius:2px;background:rgba(90,60,30,.45)}
#prog b{position:absolute;right:-24px;top:-8px;font-size:18px;line-height:1}
#hDistBox{margin-top:8px}
.cl{background:#efe2c8;border-radius:16px;padding:10px 4px 8px;opacity:.7}
.cl.own{opacity:1;background:#fff4e0;box-shadow:0 2px 8px rgba(60,30,10,.15)}
.cl.on{box-shadow:inset 0 0 0 3px #ff6b9a}
.ce{font-size:34px;line-height:1.15}
.cn{font-size:14px;font-weight:900;margin-top:2px;word-break:keep-all}
.cr{font-size:12px;font-weight:900}
#clClose{margin-top:14px;border-radius:999px;padding:12px 28px;font-size:17px;font-weight:900;background:#f0592b;color:#fff}
#card{z-index:30;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(430px,90vw);max-height:88vh;overflow-y:auto;background:#fff8e8;border-radius:26px;padding:20px 22px 18px;box-shadow:0 14px 40px rgba(40,20,5,.4);text-align:center;box-sizing:border-box}
#cTop{font-size:15px;font-weight:900;color:#d9480f}
#cBig{font-size:30px;font-weight:900;margin:6px 0 10px;line-height:1.25;word-break:keep-all}
#cBody{font-size:15px;color:#5a3d22;line-height:1.6;font-weight:700;word-break:keep-all}
#cBody .row{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;border-radius:12px;margin:5px 0;background:#f4e6cc;font-weight:900}
#cBody .row.win{background:#ffe8cc}
#cBody .cNote{font-size:12.5px;color:#8a6a4a;margin-top:8px}
#cBtns{display:flex;flex-direction:column;gap:8px;margin-top:14px}
#cBtns button{border-radius:999px;padding:13px 18px;font-size:17px;font-weight:900;background:#f4e6cc}
#cBtns button.main{background:linear-gradient(180deg,#ff8f5a,#f0592b);color:#fff;box-shadow:0 3px 0 #b9441c}
#cBtns button:disabled{opacity:.45}
#cBtns small{font-size:13px;margin-left:4px}
#fade{z-index:35;position:fixed;left:0;top:0;width:100%;height:100%;background:#1e120a;opacity:0;pointer-events:none}
#nogl,#err{z-index:50;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,88vw);background:#fff8e8;border-radius:20px;padding:22px;text-align:center;box-shadow:0 12px 40px rgba(30,15,5,.4);font-size:16px;line-height:1.6;font-weight:700;box-sizing:border-box}
#err{top:auto;bottom:10px;transform:translateX(-50%);font-size:13px;color:#b02a2a}
@media (orientation:portrait){#title{align-items:flex-end;justify-content:center;padding:0 0 calc(18px + env(safe-area-inset-bottom)) 0}#tBox{padding:16px 18px 14px}#tBox h1{font-size:30px}#tBox p{margin:6px 0 10px;font-size:14px}#banner{top:calc(96px + env(safe-area-inset-top))}}
@media (max-height:620px){#tBox{padding:14px 16px 12px}#tBox h1{font-size:26px}#tBox p{display:none}#hDist{font-size:32px}#banner{top:calc(70px + env(safe-area-inset-top))}#bText{font-size:19px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div>
<div id="danger"></div>
<div id="say" hidden></div>
<div id="hud" class="ui" hidden>
  <div id="hCoinBox" class="card"><i></i><span id="hCoin">0</span></div>
  <div id="prog"><div id="progFill"></div><i id="progN" title="숲"></i><i id="progS" title="마지막 질주"></i><b>🏁</b></div>
  <div id="hDistBox"><div id="hDist">0 m</div><div id="hBest"></div></div>
  <div id="hPow"></div>
  <div id="topR"><button id="bSound" class="card">🔊</button><button id="bPause" class="card">⏸</button></div>
</div>
<div id="banner" class="card ui" hidden><div id="bTop"></div><div id="bText"></div><div id="bSub" hidden></div></div>
<div id="big" hidden></div>
<div id="reveal" class="card ui" hidden><div id="rvIcon">🎁</div><div id="rvName"></div><div id="rvSub"></div></div>
<div id="hint" class="ui" hidden><div><b>👆</b>위로 밀면<br>점프</div><div><b>👇</b>아래로 밀면<br>미끄러지기</div><div><b>👈 👉</b>옆으로 밀면<br>길 바꾸기</div></div>
<button id="skip" class="card ui" hidden>건너뛰기 ▶</button>
<div id="title" class="ui" hidden>
  <div id="tBox" class="card">
    <h1>🏺 피라미드 대탈출<small>미라를 피해 출구까지 달려요!</small></h1>
    <p>피라미드 속으로 떨어졌어요! 큰 돌을 탄 미라가 뒤에서 굴러와요.<br>장애물을 피해 동전을 모으며 <b>4300m 출구</b>까지! 🎁 랜덤 상자도 찾아봐요.</p>
    <div id="chars"><button class="ch" data-i="0">🎈<b>사랑둥이</b></button><button class="ch" data-i="1">📏<b>왕자</b></button></div>
    <button id="bGo">▶ 달리기 시작</button>
    <div class="row2"><button id="bCloset">🎁 꾸미기 모음 <span id="clCount"></span></button><button id="mSound">🔊</button></div>
    <div id="tStats"></div>
  </div>
</div>
<div id="closet" class="ui" hidden><div id="clBox" class="card"><h2>🎁 꾸미기 모음</h2><div id="clInfo"></div><div id="clGrid"></div><button id="clClose">닫기</button></div></div>
<div id="card" class="ui" hidden><div id="cTop"></div><div id="cBig"></div><div id="cBody"></div><div id="cBtns"></div></div>
<div id="fade"></div>
<div id="nogl" hidden>이 기기는 WebGL2를 쓸 수 없어서<br>3D 달리기 게임을 열 수 없어요.<br><br><span style="font-size:13px;color:#7a5a3a">이 화면을 찍어서 선생님께 보여 주세요</span></div>
<div id="err" hidden></div>
