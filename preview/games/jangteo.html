<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>오늘은 내가 요리사!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#3a2516;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-family:'Jua',system-ui,sans-serif;}
#cv{position:fixed;inset:0;display:block;}
.pad{position:fixed;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff;font-size:20px;text-shadow:0 2px 0 rgba(0,0,0,.25);border:4px solid #3a2414;box-shadow:0 6px 0 #3a2414,0 10px 18px rgba(0,0,0,.3);touch-action:none;transition:transform .06s;}
.pad.down{transform:translateY(5px);box-shadow:0 1px 0 #3a2414,0 4px 10px rgba(0,0,0,.3);}
.pad .k{font-size:13px;opacity:.85;margin-top:2px}
.pad.off{filter:saturate(.35) brightness(.95);}
#btnA{background:radial-gradient(circle at 35% 30%,#ffb36b,#f07a2e);}
#btnB{background:radial-gradient(circle at 35% 30%,#8fe07a,#3fae49);}
.top{position:fixed;top:10px;right:10px;display:flex;gap:8px;z-index:5}
.top button{font-family:inherit;font-size:16px;border:3px solid #3a2414;background:#fff7e6;color:#3a2414;border-radius:14px;padding:6px 12px;box-shadow:0 3px 0 #3a2414;}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(40,22,10,.55);z-index:10;}
.card{background:#fff8ea;border:5px solid #3a2414;border-radius:26px;padding:26px 30px;max-width:620px;width:86%;color:#3a2414;text-align:center;box-shadow:0 10px 0 #3a2414;}
.card h1{margin:0 0 6px;font-size:44px;color:#e8612c;letter-spacing:1px;font-weight:normal}
.card h2{margin:0 0 14px;font-size:20px;font-weight:normal;color:#7a5236}
.card ul{text-align:left;margin:10px auto 18px;padding-left:22px;font-size:18px;line-height:1.55;max-width:470px}
.card .row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.card button{font-family:inherit;font-size:22px;border:4px solid #3a2414;border-radius:18px;padding:12px 22px;color:#fff;box-shadow:0 5px 0 #3a2414;cursor:pointer}
.card button small{display:block;font-size:14px;opacity:.9}
.b1{background:#3fae49}.b2{background:#f07a2e}.b3{background:#7a5236}
.stats{display:flex;gap:12px;justify-content:center;margin:14px 0 18px;flex-wrap:wrap}
.stat{background:#fff;border:3px solid #3a2414;border-radius:16px;padding:10px 16px;min-width:110px}
.stat b{display:block;font-size:34px;color:#e8612c;font-weight:normal}
.hide{display:none!important}
.b4{background:#3f8fe0}
#netBody{max-height:92vh;overflow:auto}
#netBody .field{display:flex;gap:10px;align-items:center;justify-content:center;margin:6px 0 16px;font-size:20px}
#netBody .field input{font-family:inherit;font-size:24px;width:7em;text-align:center;border:3px solid #3a2414;border-radius:14px;padding:6px 10px;background:#fff;color:#3a2414;-webkit-user-select:text;user-select:text}
#netBody .code{font-size:64px;letter-spacing:.2em;color:#fff;background:#3a2414;border-radius:18px;display:inline-block;padding:0 14px 0 26px;margin:2px 0 8px;line-height:1.3}
#netBody .chefs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0 12px}
#netBody .chef{background:#fff;border:3px solid #3a2414;border-radius:14px;padding:6px 12px;font-size:18px;display:flex;align-items:center;gap:6px}
#netBody .chef i{width:16px;height:16px;border-radius:50%;display:inline-block;border:2px solid #3a2414}
#netBody .note{font-size:17px;color:#7a5236;margin:4px 0 12px}
#netBody .msg{min-height:24px;color:#d9412b;margin-top:12px;font-size:17px}
.ov .card{max-height:96vh;overflow:auto;box-sizing:border-box}
.tLine{font-size:22px;margin:4px 0 18px;color:#3a2414;word-break:keep-all}
.gradeTag{display:inline-block;background:#fff3c4;border:3px solid #3a2414;border-radius:12px;padding:1px 12px 0;font-size:16px;color:#7a5236;margin:-4px 0 10px}
.gradeTag.big{font-size:22px;color:#d9412b}
#mathQ{background:#eef7ff;border:3px solid #3a2414;border-radius:16px;padding:8px 12px 8px;margin:0 auto 14px;max-width:560px}
#mathQ p{margin:0 0 7px;font-size:19px;line-height:1.35;word-break:keep-all}#mathQ p b{color:#3f8fe0;font-weight:normal;white-space:nowrap}
#mathQ .ch{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.card #mathQ button{font-size:19px;padding:5px 14px;border-width:3px;box-shadow:0 3px 0 #3a2414;background:#3f8fe0;min-width:84px}
.card #mathQ button.ok{background:#3fae49}.card #mathQ button.no{background:#a99a8a}.card #mathQ button:disabled{cursor:default}
#mathQ .res{font-size:16px;color:#7a5236;margin-top:6px;min-height:20px}
#mathQ.big p{font-size:23px}.card #mathQ.big button{font-size:24px;min-width:96px}
@media (max-height:520px){
  .card{padding:12px 18px;border-width:4px;box-shadow:0 6px 0 #3a2414}
  .card h1{font-size:30px;margin-bottom:2px}.card h2{font-size:15px;margin-bottom:6px}
  .card ul{font-size:14px;line-height:1.35;margin:4px auto 8px}
  .card button{font-size:17px;padding:7px 14px;border-width:3px}.card button small{font-size:12px}
  .gradeTag{font-size:13px;margin:-2px 0 5px;border-width:2px}.gradeTag.big{font-size:17px}
  .tLine{font-size:16px;margin:2px 0 8px}
  #mathQ{padding:4px 10px;margin:0 auto 8px;border-width:2px}#mathQ p{font-size:15px;margin:0 0 4px}#mathQ.big p{font-size:17px}
  .card #mathQ button,.card #mathQ.big button{font-size:16px;padding:3px 10px;min-width:70px}#mathQ .res{font-size:13px;margin-top:3px;min-height:16px}
  .stats{margin:6px 0 8px}.stat{padding:4px 10px}.stat b{font-size:24px}
}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="btnB" class="pad off"><span id="bLabel">작업</span><span class="k">꾹 누르기</span></div>
<div id="btnA" class="pad"><span id="aLabel">잡기</span><span class="k">놓기·담기</span></div>
<div class="top"><button id="muteBtn">소리 켬</button><button id="pauseBtn">멈춤</button></div>

<div id="titleOv" class="ov"><div class="card">
  <h1>오늘은 내가 요리사!</h1>
  <h2>분식 가게 · 혼자 또는 친구랑 같이</h2>
  <div class="gradeTag" id="tGrade">4학년 난이도</div>
  <p class="tLine">주문 카드를 보고 요리해서 손님에게 내요! 🍙🍢</p>
  <div class="row">
    <button class="b1" data-mode="peace">🌈 시간 제한 없이<small>천천히 해요</small></button>
    <button class="b2" data-mode="normal">⏱️ 시간 제한 있게<small>손님이 기다려요</small></button>
  </div>
  <div class="row" id="multiRow" style="margin-top:12px"><button class="b4" id="multiBtn">친구랑 같이 하기<small>방 만들기 · 방 들어가기</small></button></div>
  <div class="row" id="tutRow" style="margin-top:10px"><button class="b3" id="tutBtn" style="display:none;font-size:17px;padding:7px 16px">🎓 연습 다시 보기</button></div>
</div></div>

<div id="pauseOv" class="ov hide"><div class="card">
  <h1>잠깐 멈춤</h1>
  <div class="row"><button class="b1" id="resumeBtn">계속하기</button><button class="b3" id="quitBtn">처음으로</button></div>
</div></div>

<div id="endOv" class="ov hide"><div class="card">
  <h1>장사 끝!</h1>
  <div class="gradeTag" id="eGrade"></div>
  <h2 id="endMsg">오늘도 맛있게 만들었어요</h2>
  <div class="stats">
    <div class="stat">완성한 주문<b id="sServed">0</b></div>
    <div class="stat">밝힌 등불<b id="sLamp">0</b></div>
    <div class="stat">번 코인<b id="sCoin">0</b></div>
  </div>
  <div id="mathQ" class="hide"></div>
  <div class="row"><button class="b1" id="againBtn">다시 하기</button><button class="b3" id="homeBtn">처음으로</button></div>
</div></div>

<div id="netOv" class="ov hide"><div class="card" id="netBody"></div></div>

<div id="rotOv" class="ov hide"><div class="card"><h1>패드를 눕혀 주세요</h1><h2>가로 화면에서 할 수 있어요</h2></div></div>

<script src="../peerjs.min.js"></script>
<script src="../peer-config.js"></script>
<script>
(() => {
'use strict';
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const OUT = '#3a2414';

// ---------- 맵 ----------
const MAP = [
  "#############",
  "#abcd=KK==TP#",
  "#...........#",
  "#e....=....F#",
  "#f..........#",
  "#g....=....F#",
  "#h..........#",
  "###CC=CC=####"];
const COLS = 13, ROWS = 8;
const BOX = {a:'rice', b:'gim', c:'tuna', d:'danmuji', e:'spinach', f:'tteok', g:'eomuk', h:'sauce'};
const ING = {
  rice:{name:'밥'}, gim:{name:'김'}, tuna:{name:'참치'}, danmuji:{name:'단무지', chop:true},
  spinach:{name:'시금치', chop:true}, tteok:{name:'떡'}, eomuk:{name:'어묵', chop:true}, sauce:{name:'고추장 소스'}};
const RECIPES = {
  jumeokbap:{name:'주먹밥', ings:[['rice',0],['tuna',0],['gim',0]], how:'접시에 모두 담기'},
  kimbap:{name:'김밥', ings:[['danmuji',1],['spinach',1],['gim',0],['rice',0]], how:'도마에서 말기'},
  tteokbokki:{name:'떡볶이', ings:[['eomuk',1],['tteok',0],['sauce',0]], how:'냄비에 끓이기'}};
const MODES = {
  peace:{chop:2, roll:2, cook:6, burn:Infinity, patience:Infinity, maxOrders:2, spawn:10},
  normal:{chop:3, roll:3, cook:8, burn:10, patience:90, maxOrders:3, spawn:17}};
const ROUND = 240;
// 학년 맞춤(2026-11-25 선생님: 학생 학년 1~6에 맞게, 뚝딱 장터 3D와 같은 표). 판을 시작할 때 MODES 위에 덧씌운다. 4학년 = 원래 숫자 그대로.
// pat 손님 기다림 ×, spawn 손님 오는 사이 ×, max 한 번에 받는 주문 수 ±, burn 타기까지 ×, work 썰기·말기·끓이기 시간 ×,
// menu 메뉴가 나올 무게(1학년은 김밥 없음 — 썰기 2번 + 말기라 가장 어려움, 5~6학년은 김밥·떡볶이가 많이)
const GRADE_ADJ = {
  1: {pat:1.7, spawn:1.5, max:-1, burn:1.7, work:.8, menu:{jumeokbap:3, kimbap:0, tteokbokki:2}},
  2: {pat:1.35, spawn:1.25, max:-1, burn:1.35, work:.9, menu:{jumeokbap:3, kimbap:1, tteokbokki:2}},
  3: {pat:1.15, spawn:1.1, max:0, burn:1.15, work:1, menu:{jumeokbap:4, kimbap:3, tteokbokki:3}},
  4: {pat:1, spawn:1, max:0, burn:1, work:1, menu:{jumeokbap:1, kimbap:1, tteokbokki:1}},
  5: {pat:.88, spawn:.9, max:0, burn:.9, work:1, menu:{jumeokbap:2, kimbap:3, tteokbokki:3}},
  6: {pat:.78, spawn:.82, max:0, burn:.8, work:1, menu:{jumeokbap:1, kimbap:2, tteokbokki:2}}};
// 광장 back.js의 PLAZA_GRADE()(1~6). back.js가 게임보다 늦게 읽혀서 판을 시작할 때 묻고, 없으면 주소의 ?grade=, 그것도 없으면 4학년
function localGrade(){
  let g = NaN;
  try { if (typeof window.PLAZA_GRADE === 'function') g = +window.PLAZA_GRADE(); } catch (e){}
  if (!(g >= 1 && g <= 6)) try { g = +new URLSearchParams(location.search).get('grade'); } catch (e){}
  return g >= 1 && g <= 6 ? Math.round(g) : 4;
}
let grade = 4;   // 이번 판 학년(친구랑 하면 방장 학년)
function gradeMode(base, g){
  const a = GRADE_ADJ[g] || GRADE_ADJ[4];
  return Object.assign({}, base, {patience: base.patience * a.pat, spawn: base.spawn * a.spawn, maxOrders: Math.max(1, base.maxOrders + a.max), burn: base.burn * a.burn,
    chop: base.chop * a.work, roll: base.roll * a.work, cook: base.cook * a.work});
}
const gradeMenu = g => (GRADE_ADJ[g] || GRADE_ADJ[4]).menu;
const gradeLabel = g => g + '학년 난이도' + (g <= 2 ? ' · 쉬워요' : g >= 5 ? ' · 도전!' : '');
const SLOTS = [3, 4, 6, 7];
const ANIMALS = ['cat','bear','rabbit','dog','frog','pig'];

// ---------- 상태 ----------
let W, H, dpr, T, ox, oy, topH, bg, bgCtx;
let st = [];
let player, players = [], dynList = [], orders, parts, floats, mode, modeKey, timeLeft, served, coins, missed, spawnT, running = false, paused = false;
let now = 0, last = 0, orderSeq = 0, toast = null, chopSnd = 0;
let target = null;
const keys = {};
let joy = {id:null, ox:0, oy:0, x:0, y:0, active:false};
let holdB = false, holdBkey = false;
let tut = null, tutPress = false, hudCard0 = null;   // 처음 하는 학생: 보여 주기 → 따라 하기(아래 createTutorial) · 보여 주기가 누르는 잡기 · 첫 주문 카드 자리

function buildStations(){
  st = []; dynList = [];
  for (let y = 0; y < ROWS; y++){
    st.push([]);
    for (let x = 0; x < COLS; x++){
      const ch = MAP[y][x];
      let s = null;
      if (ch === '=') s = {type:'counter', item:null};
      else if (ch === 'K') s = {type:'board', items:[], progress:0};
      else if (ch === 'F') s = {type:'stove', pot:{items:[], state:'idle', cook:0, doneT:0}};
      else if (ch === 'T') s = {type:'trash'};
      else if (ch === 'P') s = {type:'plates'};
      else if (ch === 'C') s = {type:'serve'};
      else if (BOX[ch]) s = {type:'box', ing:BOX[ch]};
      if (s){ s.x = x; s.y = y; s.flash = 0; dynList.push(s); }
      st[y].push(s);
    }
  }
}
const stAt = (x, y) => (y >= 0 && y < ROWS && x >= 0 && x < COLS) ? st[y][x] : null;
const solidAt = (tx, ty) => (tx < 0 || ty < 0 || tx >= COLS || ty >= ROWS) ? true : MAP[ty][tx] !== '.';
function collides(x, y, r){
  for (const [dx, dy] of [[-r,-r],[r,-r],[-r,r],[r,r]]) if (solidAt(Math.floor(x+dx), Math.floor(y+dy))) return true;
  return false;
}

function reset(m, g){
  roundSeq++;
  try { net.qPend = {}; } catch (e) { /* 처음 불릴 때는 net이 아직 없음 */ }   // 친구가 풀던 문제 결과는 새 판에 들어가지 않게(검토 2)
  grade = g >= 1 && g <= 6 ? g : localGrade();   // 친구 기기는 방장이 보낸 학년(start의 g)
  modeKey = m; mode = gradeMode(MODES[m], grade);
  buildStations();
  player = makeChef(net.myId, net.name, net.myCi, SPAWNS[0][0], SPAWNS[0][1]);
  players = [player];
  orders = []; parts = []; floats = [];
  timeLeft = ROUND; served = 0; coins = 0; missed = 0; spawnT = 1.2; orderSeq = 0;
  toast = {text:'주문 카드를 보고 재료 상자에서 재료를 집어요!', t:4.5};
}

// ---------- 규칙 ----------
function plateRecipe(p){
  const c = p.c;
  if (c.length === 1 && c[0].t === 'dish' && (c[0].id === 'kimbap' || c[0].id === 'tteokbokki')) return c[0].id;
  if (c.length === 3 && c.every(i => i.t === 'ing' && !i.cut) && c.map(i => i.id).sort().join() === 'gim,rice,tuna') return 'jumeokbap';
  return null;
}
function plateAccept(p, item){
  if (!item || item.t === 'plate') return false;
  if (p.c.some(i => i.t === 'dish')) return false;
  if (item.t === 'dish'){ if (p.c.length) return false; p.c.push(item); return true; }
  if (p.c.length >= 3) return false;
  p.c.push(item); return true;
}
function isKimbapSet(items){
  if (items.length !== 4 || items.some(i => i.t !== 'ing')) return false;
  const m = {}; items.forEach(i => m[i.id] = i);
  return m.gim && m.rice && m.danmuji && m.spinach && !m.gim.cut && !m.rice.cut && m.danmuji.cut && m.spinach.cut;
}
function workType(s){
  if (!s || s.type !== 'board') return null;
  if (s.items.length === 1 && s.items[0].t === 'ing' && ING[s.items[0].id].chop && !s.items[0].cut) return 'chop';
  if (isKimbapSet(s.items)) return 'roll';
  return null;
}
function resetPot(pot){ pot.items = []; pot.state = 'idle'; pot.cook = 0; pot.doneT = 0; }

const R = (kind, msg) => ({kind, msg});
function doA(p, s){
  const h = p.hold;
  switch (s.type){
    case 'box': {
      const it = {t:'ing', id:s.ing, cut:false};
      if (!h){ p.hold = it; return R('pick'); }
      if (h.t === 'ing' && h.id === s.ing && !h.cut){ p.hold = null; return R('place'); }
      if (h.t === 'plate') return plateAccept(h, it) ? R('place') : R('bad', '접시에 더 못 담아요');
      return R('bad', '손이 꽉 찼어요');
    }
    case 'counter': {
      if (!h){ if (s.item){ p.hold = s.item; s.item = null; return R('pick'); } return null; }
      if (!s.item){ s.item = h; p.hold = null; return R('place'); }
      if (s.item.t === 'plate' && h.t !== 'plate'){ if (plateAccept(s.item, h)){ p.hold = null; return R('place'); } return R('bad', '접시에 더 못 담아요'); }
      if (h.t === 'plate' && s.item.t !== 'plate'){ if (plateAccept(h, s.item)){ s.item = null; return R('place'); } return R('bad', '접시에 더 못 담아요'); }
      return R('bad', '자리가 차 있어요');
    }
    case 'board': {
      if (!h){ if (s.items.length){ p.hold = s.items.pop(); s.progress = 0; return R('pick'); } return null; }
      if (h.t === 'plate'){
        if (s.items.length === 1){ if (plateAccept(h, s.items[0])){ s.items.pop(); s.progress = 0; return R('place'); } return R('bad', '접시에 더 못 담아요'); }
        if (s.items.length > 1) return R('bad', '도마 위 김밥을 먼저 말아요');
        return null;
      }
      if (h.t === 'dish'){ if (!s.items.length){ s.items.push(h); p.hold = null; return R('place'); } return R('bad', '도마가 차 있어요'); }
      if (s.items.some(i => i.t === 'dish')) return R('bad', '도마가 차 있어요');
      if (s.items.length >= 4) return R('bad', '도마가 꽉 찼어요');
      s.items.push(h); p.hold = null; s.progress = 0; return R('place');
    }
    case 'stove': {
      const pot = s.pot;
      if (h && h.t === 'plate'){
        if (pot.state === 'done' || pot.state === 'burnt'){
          if (h.c.length) return R('bad', '빈 접시가 필요해요');
          h.c.push({t:'dish', id: pot.state === 'done' ? 'tteokbokki' : 'burnt'}); resetPot(pot); return R('place');
        }
        if (pot.state === 'cooking') return R('bad', '아직 끓고 있어요');
        return R('bad', '냄비가 비었어요');
      }
      if (h && h.t === 'ing'){
        if (pot.state !== 'idle') return R('bad', '냄비가 바빠요');
        if (!['tteok','eomuk','sauce'].includes(h.id)) return R('bad', '떡볶이 재료가 아니에요');
        if (h.id === 'eomuk' && !h.cut) return R('bad', '어묵을 먼저 썰어요');
        if (pot.items.some(i => i.id === h.id)) return R('bad', '이미 넣었어요');
        pot.items.push(h); p.hold = null;
        if (pot.items.length === 3){ pot.state = 'cooking'; pot.cook = 0; }
        return R('place');
      }
      if (!h){
        if (pot.state === 'idle' && pot.items.length){ p.hold = pot.items.pop(); return R('pick'); }
        if (pot.state === 'done') return R('bad', '접시를 들고 와서 담아요');

    }
    case 'plates': {

      return R('bad', '손이 꽉 찼어요');
    }
    case 'trash': {
      if (!h) return null;
      if (h.t === 'plate'){ if (!h.c.length) return R('bad', '빈 접시예요'); h.c = []; return R('trash'); }

    }
    case 'serve': {
      if (!h) return null;
      if (h.t !== 'plate') return R('bad', '접시에 담아서 내요');
      const rid = plateRecipe(h);
      if (!rid) return R('bad', '아직 완성이 안 됐어요');
      const o = orders.find(o => o.rid === rid && !o.leaving && !o.served);
      if (!o) return R('bad', '주문에 없는 음식이에요');

}
function labelA(p, s){
  const h = p.hold;

  switch (s.type){
    case 'box': return !h ? '집기' : (h.t === 'ing' && h.id === s.ing && !h.cut) ? '되돌리기' : (h.t === 'plate') ? '담기' : '';
    case 'counter': if (!h) return s.item ? '집기' : ''; if (!s.item) return '놓기'; return (s.item.t === 'plate') !== (h.t === 'plate') ? '담기' : '';
    case 'board': if (!h) return s.items.length ? '집기' : ''; return h.t === 'plate' ? (s.items.length === 1 ? '담기' : '') : '올리기';
    case 'stove': if (h && h.t === 'plate') return (s.pot.state === 'done' || s.pot.state === 'burnt') ? '담기' : ''; if (h && h.t === 'ing') return '넣기'; return (!h && s.pot.state === 'idle' && s.pot.items.length) ? '빼기' : '';
    case 'plates': return !h ? '접시' : '';
    case 'trash': return h ? '버리기' : '';

}

function actionA(p){

  if (net.mode === 'guest' && p === player){

// ---------- 주문 ----------
function spawnOrder(force){
  const active = orders.filter(o => !o.leaving && !o.served);
  if (!force && active.length >= Math.min(SLOTS.length, mode.maxOrders + players.length - 1)) return;
  const free = SLOTS.filter(c => !orders.some(o => o.col === c));
  if (!free.length) return;
  let rid;
  const mw = gradeMenu(grade), first = ['jumeokbap', 'tteokbokki', 'kimbap'].filter(k => mw[k] > 0);   // 처음 몇 개는 쉬운 것부터 차례로(학년에 없는 메뉴는 빼고)
  if (orderSeq < first.length) rid = first[orderSeq];
  else { const ks = Object.keys(mw).filter(k => mw[k] > 0); let r = Math.random() * ks.reduce((a, k) => a + mw[k], 0); rid = ks[ks.length - 1]; for (const k of ks){ r -= mw[k]; if (r < 0){ rid = k; break; } } }
  const col = free[Math.floor(Math.random() * free.length)];
  orders.push({id: ++orderSeq, rid, col, t:0, anim:0, leaving:false, served:false, out:0, q: orderSeq % QUIZ_EVERY === 2,   // q: 문제 손님(id 2·5·8…, ++orderSeq 다음에 셈)
    animal: ANIMALS[(orderSeq * 5 + col) % ANIMALS.length]});
  sfx('ding');
}
// ---------- 문제 내는 손님(2026-11-25 선생님: 퀴즈는 고르는 말풍선이 아니라 놀이 속에서 꼭 풀고, 풀면 이점 — 뚝딱 장터 3D와 같은 규칙) ----------
// 주문 3개 중 하나(2·5·8…번째)는 '❓ 문제 손님': 음식을 내면 손님이 학년 문제를 내요(광장 quiz.js PLAZA_QUIZ.ask). 낸 사람의 기기에서 묻고(친구 기기는 방장에게 결과를 보냄),
// 처음에 맞히면 팁 +10 코인 + 기다리던 손님들 기다림이 처음으로, 힌트 보고 맞히면 팁 +3 코인. 광장 밖(퀴즈 없음·?quiz=0)은 그냥 통과(보너스 없음 = 원래 균형)
const QUIZ_EVERY = 3, QUIZ_TIP = {big: 10, small: 3};
window.PLAZA_QUIZ_GATES = true;   // 고르는 ❓ 말풍선은 끄고 문제 손님으로만
const DISH_ICON = {jumeokbap: '🍙', kimbap: '🍱', tteokbokki: '🍢'};
function quizAsk(rid){
  const o = {game: 'jangteo', why: '손님이 문제를 내요!', icon: DISH_ICON[rid] || '🍙', grade,   // 친구랑 하면 방장 학년(grade)
    big: `팁 +${QUIZ_TIP.big} 코인 · 손님들이 더 기다려 줘요`, small: `팁 +${QUIZ_TIP.small} 코인`};
  try { if (window.PLAZA_QUIZ && window.PLAZA_QUIZ.ask) return window.PLAZA_QUIZ.ask(o); } catch (e){}
  return Promise.resolve({correct: true, first: false, skipped: true});
}
function quizTip(first, who){   // 방장·혼자 기기에서만
  if (!running) return;
  const big = !!first, tip = big ? QUIZ_TIP.big : QUIZ_TIP.small, by = who ? who + ': ' : '';
  coins += tip;
  if (big) for (const o of orders) if (!o.leaving && !o.served) o.t = 0;
  toast = {text: `${by}${big ? '한 번에 정답! 손님들이 더 기다려 줘요 · ' : '문제를 풀었어요! '}팁 +${tip} 코인`, t: 3.2};
  sfx('serve'); burst(COLS / 2, ROWS / 2, 'star', big ? 12 : 6, '#ffd43b');
}
let quizPend = 0, roundSeq = 0;   // 이 기기에서 아직 끝나지 않은 문제 수(연습이 퀴즈를 기다리게) · 판 번호(판이 바뀐 뒤 끝난 문제는 보상 없음)
function askServer(o, p){   // 문제 손님에게 음식을 낸 사람의 기기에서 묻기
  if (!p || p === player || net.mode !== 'host'){ const rs = roundSeq; quizPend++; quizAsk(o.rid).then(r => { quizPend = Math.max(0, quizPend - 1); if (rs === roundSeq && r && !r.skipped && r.correct) quizTip(r.first, null); }, () => { quizPend = Math.max(0, quizPend - 1); }); return; }
  const c = net.conns[p.id]; if (!c || !c.open) return;
  const k = 'q' + (++net.qSeq || (net.qSeq = 1)); (net.qPend = net.qPend || {})[k] = p.id;
  try { c.send({t: 'ask', k, rid: o.rid}); } catch (e){}
}
function serveOrder(o, p){
  o.served = true;
  if (o.q) askServer(o, p);
  served++;
  const tip = isFinite(mode.patience) ? Math.max(0, Math.round((1 - o.t / mode.patience) * 6)) : 3;
  const gain = 10 + tip;
  coins += gain;
  burst(o.col + .5, 7.6, 'heart', 10, '#ff6b8a');
  burst(o.col + .5, 7.4, 'star', 8, '#ffd43b');
  addFloat('+' + gain + ' 코인', o.col + .5, 6.9, '#e8612c');
}

// ---------- 갱신 ----------
function update(dt){
  now += dt;
  if (toast){ toast.t -= dt; if (toast.t <= 0) toast = null; }
  if (!running || paused) { updateFx(dt); return; }
  const isGuest = net.mode === 'guest';
  if (!(tut && tut.active)) timeLeft -= dt;   // 연습 동안은 시계 멈춤
  if (timeLeft <= 0){ timeLeft = 0; if (!isGuest){ endRound(); return; } }

  // 이동
  let mx = 0, my = 0;
  if (keys.ArrowLeft || keys.KeyA) mx -= 1;
  if (keys.ArrowRight || keys.KeyD) mx += 1;
  if (keys.ArrowUp || keys.KeyW) my -= 1;
  if (keys.ArrowDown || keys.KeyS) my += 1;
  if (joy.active){ mx += joy.x; my += joy.y; }
  if (tut && tut.lock){ mx = my = 0; holdB = holdBkey = false; }   // 보여 주기: 내 요리사는 연습 대본이 움직여요
  const len = Math.hypot(mx, my);
  player.moving = len > 0.18;
  if (player.moving){
    const n = Math.min(1, len);
    mx /= len; my /= len;
    player.dir = {x:mx, y:my};
    const sp = 3.6 * n * dt, r = 0.3;
    const nx = player.x + mx * sp, ny = player.y + my * sp;
    if (!collides(nx, player.y, r)) player.x = nx;
    if (!collides(player.x, ny, r)) player.y = ny;
    player.walkT += dt * n;
  }
  player.pop = Math.max(0, player.pop - dt);
  target = findTarget(player);
  if (tut && tut.active){ tut.tick(); if (!running) return; target = findTarget(player); }   // 보여 주기·따라 하기

  // 친구 요리사는 받은 위치로 부드럽게 따라가요
  for (const p of players){
    if (p === player) continue;
    const k = Math.min(1, dt * 12);
    p.x += (p.tx - p.x) * k; p.y += (p.ty - p.y) * k;
    if (p.moving) p.walkT += dt;
    p.pop = Math.max(0, p.pop - dt);
  }

  if (isGuest){
    // 친구 기기: 내 위치를 방장 기기에게 보내고, 나머지는 방장 화면을 따라가요
    net.sendT -= dt;
    if (net.sendT <= 0 && net.host && net.host.open){
      net.sendT = 1 / 15;
      net.host.send({t:'in', x:r2(player.x), y:r2(player.y), dx:r2(player.dir.x), dy:r2(player.dir.y), m:player.moving ? 1 : 0, w:((holdB || holdBkey) && target) ? [target.x, target.y] : 0});
    }
    player.working = !!((holdB || holdBkey) && target && workType(target));
    for (const s of dynList){
      s.flash = Math.max(0, s.flash - dt);
      if (s.type !== 'stove') continue;
      const ps = s.pot.state;
      if ((ps === 'cooking' && Math.random() < dt * 6) || (ps === 'done' && Math.random() < dt * 3)) burst(s.x + .5, s.y + .05, 'steam', 1, '#ffffff');
      else if (ps === 'burnt' && Math.random() < dt * 5) burst(s.x + .5, s.y + .05, 'smoke', 1, '#555555');
    }
    for (const o of orders) o.anim = Math.min(1, o.anim + dt * 2.2);
    updateFx(dt);
    return;
  }


  // 작업(꾹 누르기): 요리사마다
  for (const p of players){
    const hb = p === player ? (holdB || holdBkey) : p.holdB;
    let tg = target;
    if (p !== player) tg = p.workS;
    const wt = hb && tg ? workType(tg) : null;
    p.working = !!wt;
    if (!wt) continue;
    tg.progress += dt / (wt === 'chop' ? mode.chop : mode.roll);
    p.chopSnd = (p.chopSnd || 0) - dt;
    if (p.chopSnd <= 0){ sfx('chop'); p.chopSnd = 0.2; burst(tg.x + .5, tg.y + .2, 'chip', 2, wt === 'chop' ? '#9bd06a' : '#ffffff'); }
    if (tg.progress >= 1){
      tg.progress = 0;
      if (wt === 'chop') tg.items[0].cut = true;
      else tg.items = [{t:'dish', id:'kimbap'}];
      sfx('done'); burst(tg.x + .5, tg.y + .2, 'star', 7, '#ffd43b');
      addFloat(wt === 'chop' ? '썰기 완료!' : '김밥 완성!', tg.x + .5, tg.y - .5, '#2f8f3a');
    }
  }

  // 냄비
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++){
    const s = st[y][x]; if (!s) continue;
    s.flash = Math.max(0, s.flash - dt);
    if (s.type !== 'stove') continue;
    const pot = s.pot;
    if (pot.state === 'cooking'){
      pot.cook += dt / mode.cook;
      if (Math.random() < dt * 6) burst(x + .5, y + .05, 'steam', 1, '#ffffff');
      if (pot.cook >= 1){ pot.state = 'done'; pot.doneT = 0; sfx('done'); addFloat('떡볶이 완성!', x + .2, y - .5, '#d8352a'); }
    } else if (pot.state === 'done'){
      pot.doneT += dt;
      if (Math.random() < dt * 3) burst(x + .5, y + .05, 'steam', 1, '#ffffff');
      if (pot.doneT > mode.burn){ pot.state = 'burnt'; sfx('bad'); addFloat('앗, 탔어요!', x + .2, y - .5, '#555'); }
    } else if (pot.state === 'burnt'){
      if (Math.random() < dt * 5) burst(x + .5, y + .05, 'smoke', 1, '#555555');
    }
  }

  // 주문
  if (!(tut && tut.active)) spawnT -= dt;   // 연습 동안은 연습 주문만
  const active = orders.filter(o => !o.leaving && !o.served);
  if (spawnT <= 0 || (active.length === 0 && spawnT > 2.5)){
    spawnOrder(false); spawnT = mode.spawn / (1 + .35 * (players.length - 1));
  }
  for (const o of orders){
    o.anim = Math.min(1, o.anim + dt * 2.2);
    if (o.served || o.leaving){ o.out += dt; continue; }
    if (!(tut && tut.active)) o.t += dt;
    if (o.t > mode.patience){ o.leaving = true; missed++; addFloat('아쉬워요', o.col + .5, 7, '#7a5236'); }
  }
  orders = orders.filter(o => o.out < 1.1);
  if (net.mode === 'host'){ net.snapT -= dt; if (net.snapT <= 0){ net.snapT = 1 / 12; hostSend(makeSnap()); } }
  updateFx(dt);
}
function updateFx(dt){
  for (const p of parts){ p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.kind === 'chip' || p.kind === 'star') p.vy += 6 * dt; }
  parts = parts.filter(p => p.life > 0);
  for (const f of floats){ f.life -= dt; f.y -= dt * 0.7; }
  floats = floats.filter(f => f.life > 0);
}
function findTarget(p){
  p = p || player;
  const px = p.x, py = p.y, tx = Math.floor(px), ty = Math.floor(py);
  let best = null, bs = -1e9;
  for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
    const s = stAt(tx + dx, ty + dy); if (!s) continue;
    const dist = Math.hypot(tx + dx + .5 - px, ty + dy + .5 - py);
    if (dist > 1.3) continue;
    const score = (dx * p.dir.x + dy * p.dir.y) * 2 - dist;
    if (score > bs){ bs = score; best = s; }
  }
  return best;
}
function burst(x, y, kind, n, color){
  if (net.mode === 'host' && kind !== 'steam' && kind !== 'smoke') netEv(['b', r2(x), r2(y), kind, n, color]);
  if (parts.length > 90) return;
  for (let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2, v = kind === 'steam' || kind === 'smoke' ? 0.3 : 1 + Math.random() * 1.6;
    parts.push({x, y, kind, color,
      vx: kind === 'steam' || kind === 'smoke' ? (Math.random() - .5) * .3 : Math.cos(a) * v,
      vy: kind === 'steam' || kind === 'smoke' ? -0.6 - Math.random() * .4 : (kind === 'heart' ? -1.2 - Math.random() : Math.sin(a) * v - 1.2),
      life: kind === 'steam' || kind === 'smoke' ? 1.2 : 0.9, max: kind === 'steam' || kind === 'smoke' ? 1.2 : 0.9,
      size: kind === 'chip' ? .06 + Math.random() * .05 : .12 + Math.random() * .06});
  }
}
function addFloat(text, x, y, color){ if (net.mode === 'host') netEv(['f', text, r2(x), r2(y), color]); floats.push({text, x, y, color, life:1.3}); }

function endRound(){
  running = false;
  if (net.mode === 'host'){ net.ev.length = 0; hostSend(makeSnap()); hostSend({t:'end', sv:served, cn:coins}); }
  showEnd();
  // 주문을 3개 이상 완성하면 '깼어요'(반 별 +1, 같이 한 방은 한 팀으로 별 하나)
  if (served >= 3) try { window.dispatchEvent(new CustomEvent('minigame-clear', {detail:{game:'jangteo', served, coins, team:players.length}})); } catch (e){}
}

// ---------- 그림 도구 ----------
function rr(c, x, y, w, h, r){ c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }

function rice(c){

  c.fillStyle = '#e4dccb';
  for (const [gx, gy] of [[-6,-5],[2,-8],[7,-3],[-1,-2],[-9,-1],[5,-6]]){ c.beginPath(); c.ellipse(gx, gy, 2, 1.1, .5, 0, 7); c.fill(); }

}
function onigiriPath(c){ c.beginPath(); c.moveTo(0, -15); c.quadraticCurveTo(4, -15, 16, 8); c.quadraticCurveTo(18, 14, 11, 14); c.lineTo(-11, 14); c.quadraticCurveTo(-18, 14, -16, 8); c.quadraticCurveTo(-4, -15, 0, -15); c.closePath(); }

  c.lineWidth = 2.4; c.strokeStyle = OUT; c.lineJoin = 'round'; c.lineCap = 'round';
  switch (id){
    case 'rice': rice(c); break;
    case 'gim':
      rr(c, -15, -13, 30, 26, 4); fs(c, '#1d3b2b');
      c.strokeStyle = '#3f7356'; c.lineWidth = 2;
      for (let i = -8; i <= 8; i += 8){ c.beginPath(); c.moveTo(i - 4, -9); c.lineTo(i + 4, 9); c.stroke(); }
      break;
    case 'tuna':
      rr(c, -13, -9, 26, 22, 5); fs(c, '#cfd5dd');
      c.fillStyle = '#2f7fd1'; c.fillRect(-11.5, -3, 23, 11);
      c.fillStyle = '#fff'; c.beginPath(); c.ellipse(-1.5, 2.5, 5.5, 3, 0, 0, 7); c.fill();
      c.beginPath(); c.moveTo(3.5, 2.5); c.lineTo(8, -.5); c.lineTo(8, 5.5); c.closePath(); c.fill();
      c.beginPath(); c.ellipse(0, -9, 13, 5, 0, 0, 7); fs(c, '#eef1f5');
      break;
    case 'danmuji':
      if (!cut){ c.rotate(-.6); rr(c, -6, -17, 12, 34, 5); fs(c, '#ffd43b'); c.strokeStyle = '#fff3a6'; c.lineWidth = 2.5; c.beginPath(); c.moveTo(-2, -11); c.lineTo(-2, 10); c.stroke(); }
      else for (const [a, b, r] of [[-9,-3,-.3],[0,4,.2],[9,-3,.5]]){ c.save(); c.translate(a, b); c.rotate(r); rr(c, -3.5, -9, 7, 18, 3); fs(c, '#ffd43b'); c.restore(); }
      break;
    case 'spinach':
      if (!cut){
        c.strokeStyle = '#86c44f'; c.lineWidth = 3.2; c.beginPath(); c.moveTo(0, 16); c.lineTo(-6, -4); c.moveTo(0, 16); c.lineTo(0, -6); c.moveTo(0, 16); c.lineTo(7, -3); c.stroke();
        c.strokeStyle = OUT; c.lineWidth = 2.4;
        for (const [a, b, r, col] of [[-8,-5,-.5,'#3fae49'],[8,-4,.5,'#2f9a3f'],[0,-9,0,'#4cc457']]){ c.save(); c.translate(a, b); c.rotate(r); c.beginPath(); c.ellipse(0, 0, 6.5, 10, 0, 0, 7); fs(c, col); c.restore(); }
      } else for (const [a, b, r] of [[-8,-3,.3],[2,5,-.4],[8,-5,.8],[-2,-9,-.2],[-9,7,.6],[9,6,.1]]){ c.save(); c.translate(a, b); c.rotate(r); c.beginPath(); c.ellipse(0, 0, 4.6, 3, 0, 0, 7); fs(c, '#3fae49'); c.restore(); }
      break;
    case 'tteok':
      for (const [a, b] of [[-3,-9],[3,0],[-2,9]]){ rr(c, a - 11, b - 4, 22, 8, 4); fs(c, '#fbf5e9'); }
      break;
    case 'eomuk':
      if (!cut){
        rr(c, -15, -11, 30, 22, 4); fs(c, '#d9a35b');
        c.strokeStyle = '#a8702f'; c.lineWidth = 2;
        for (const yy of [-4, 4]){ c.beginPath(); c.moveTo(-11, yy); c.quadraticCurveTo(-5, yy - 4, 0, yy); c.quadraticCurveTo(5, yy + 4, 11, yy); c.stroke(); }
      } else for (const [a, b, r] of [[-8,-6,.2],[7,-6,-.3],[-6,7,-.2],[8,6,.4]]){ c.save(); c.translate(a, b); c.rotate(r); rr(c, -6, -4.5, 12, 9, 2.5); fs(c, '#d9a35b'); c.restore(); }
      break;
    case 'sauce':
      rr(c, -11, -7, 22, 23, 6); fs(c, '#d93a2b');
      rr(c, -9, -14, 18, 8, 3); fs(c, '#4a2c1a');
      c.fillStyle = '#fff3d6'; c.beginPath(); c.arc(0, 5, 6.5, 0, 7); c.fill();
      c.fillStyle = '#d93a2b'; c.font = '10px Jua, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('고', 0, 5.5);
      break;
    case 'kimbap':
      for (const [a, b] of [[-9,4],[9,4],[0,-7]]){
        c.beginPath(); c.arc(a, b, 9, 0, 7); fs(c, '#1d3b2b');
        c.fillStyle = '#fff'; c.beginPath(); c.arc(a, b, 6.3, 0, 7); c.fill();
        c.fillStyle = '#ffd43b'; c.beginPath(); c.arc(a + 1.7, b - 1, 2.1, 0, 7); c.fill();
        c.fillStyle = '#3fae49'; c.beginPath(); c.arc(a - 2, b + 1, 2.1, 0, 7); c.fill();
        c.fillStyle = '#f08a3c'; c.beginPath(); c.arc(a + .4, b + 2.8, 1.6, 0, 7); c.fill();
      }
      break;
    case 'tteokbokki':
      c.beginPath(); c.ellipse(0, 4, 18, 11, 0, 0, 7); fs(c, '#f4ead8');
      c.fillStyle = '#d8352a'; c.beginPath(); c.ellipse(0, 2, 14, 8, 0, 0, 7); c.fill();
      c.lineWidth = 1.5;
      for (const [a, b, r] of [[-6,1,.4],[4,-1.5,-.3],[0,5,.1],[7,4,.6],[-4,-3,-.6]]){ c.save(); c.translate(a, b); c.rotate(r); rr(c, -4.5, -2, 9, 4, 2); c.fillStyle = '#fff6ea'; c.fill(); c.stroke(); c.restore(); }
      c.fillStyle = '#d9a35b'; c.beginPath(); c.moveTo(-11, -1); c.lineTo(-5, -4); c.lineTo(-7, 3); c.closePath(); c.fill();
      c.fillStyle = '#7cc35a'; for (const [a, b] of [[2,-4],[-2,6],[9,0]]){ c.beginPath(); c.arc(a, b, 1.4, 0, 7); c.fill(); }
      break;
    case 'jumeokbap':
      onigiriPath(c); c.fillStyle = '#ffffff'; c.fill();
      c.save(); onigiriPath(c); c.clip(); c.fillStyle = '#1d3b2b'; c.fillRect(-9, 2, 18, 14); c.restore();
      onigiriPath(c); c.stroke();
      c.fillStyle = '#e4dccb'; for (const [a, b] of [[-3,-7],[3,-3],[-6,-1]]){ c.beginPath(); c.ellipse(a, b, 1.8, 1, .4, 0, 7); c.fill(); }
      break;
    case 'burnt':
      c.beginPath(); c.ellipse(0, 4, 18, 11, 0, 0, 7); fs(c, '#f4ead8');
      c.fillStyle = '#2b2522'; c.beginPath(); c.ellipse(0, 2, 14, 8, 0, 0, 7); c.fill();
      c.strokeStyle = '#8c8c8c'; c.lineWidth = 2.5; c.beginPath(); c.moveTo(-4, -6); c.quadraticCurveTo(-8, -11, -3, -15); c.moveTo(5, -6); c.quadraticCurveTo(1, -11, 6, -16); c.stroke();
      break;
  }
  c.restore();
}
function knifeBadge(c, x, y, s){
  c.save(); c.translate(x, y); c.rotate(-.7); c.lineWidth = Math.max(1.2, s * .08); c.strokeStyle = OUT;
  rr(c, -s * .12, -s * .5, s * .24, s * .55, s * .1); fs(c, '#e9eef3');
  rr(c, -s * .1, s * .05, s * .2, s * .38, s * .08); fs(c, '#8a5a36');
  c.restore();
}
function drawPlate(c, p, x, y, s){
  c.save(); c.lineWidth = Math.max(1.5, s * .045); c.strokeStyle = OUT;
  c.beginPath(); c.ellipse(x, y, s * .5, s * .31, 0, 0, 7); c.fillStyle = '#fdfdfd'; c.fill(); c.stroke();
  c.beginPath(); c.ellipse(x, y - s * .02, s * .33, s * .19, 0, 0, 7); c.strokeStyle = '#d5dbe2'; c.lineWidth = s * .03; c.stroke();
  c.restore();
  const rid = plateRecipe(p);
  if (rid === 'jumeokbap') icon(c, 'jumeokbap', false, x, y - s * .14, s * .62);
  else if (p.c.length === 1 && p.c[0].t === 'dish') icon(c, p.c[0].id, false, x, y - s * .1, s * .7);
  else { const n = p.c.length; p.c.forEach((it, i) => icon(c, it.id, it.cut, x + (i - (n - 1) / 2) * s * .27, y - s * .1 - (i % 2) * s * .05, s * .42)); }
}
function drawItem(c, it, x, y, s){
  if (!it) return;
  if (it.t === 'plate') drawPlate(c, it, x, y + s * .12, s);
  else icon(c, it.id, it.cut, x, y, s * .8);
}

// ---------- 배경(한 번만 그림) ----------
function buildBg(){
  bg = document.createElement('canvas');
  bg.width = Math.round(W * dpr); bg.height = Math.round(H * dpr);
  const c = bgCtx = bg.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  // 하늘
  const g = c.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#ffe7c2'); g.addColorStop(1, '#f2b77b');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  // 먼 지붕들
  c.fillStyle = 'rgba(160,90,50,.18)';
  for (let i = 0; i < 9; i++){ const bx = (i / 8) * W - 40, bw = 120 + (i % 3) * 30, bh = 60 + (i % 4) * 22; c.beginPath(); c.moveTo(bx, H); c.lineTo(bx, H - bh); c.lineTo(bx + bw / 2, H - bh - 40); c.lineTo(bx + bw, H - bh); c.lineTo(bx + bw, H); c.fill(); }
  // 깃발 줄
  c.strokeStyle = '#7a5236'; c.lineWidth = 2;
  const fy = topH * .92;
  c.beginPath(); c.moveTo(0, fy - 8); c.quadraticCurveTo(W / 2, fy + 18, W, fy - 8); c.stroke();
  const fcol = ['#f07a2e','#3fae49','#ffd43b','#6fa8dc','#ff6b8a'];
  for (let i = 0; i < 26; i++){
    const t = (i + .5) / 26, x = t * W, yy = (1 - t) * (1 - t) * (fy - 8) + 2 * (1 - t) * t * (fy + 18) + t * t * (fy - 8);
    c.fillStyle = fcol[i % 5]; c.beginPath(); c.moveTo(x - 9, yy); c.lineTo(x + 9, yy); c.lineTo(x, yy + 16); c.closePath(); c.fill();
  }
  // 바깥 틀
  const mw = COLS * T, mh = (ROWS + 1) * T;
  c.fillStyle = 'rgba(58,36,20,.35)'; rr(c, ox - 10, oy - T * .3 + 6, mw + 20, mh + T * .3 + 10, 18); c.fill();

  // 골목(손님 줄)
  for (let x = 0; x < COLS; x++){
    const px = ox + x * T, py = oy + ROWS * T;
    c.fillStyle = (x % 2) ? '#cdbfa8' : '#d6c9b3'; c.fillRect(px, py, T, T);
    c.strokeStyle = 'rgba(120,95,70,.35)'; c.lineWidth = 1.5;
    c.beginPath(); c.moveTo(px, py + T * .5); c.lineTo(px + T, py + T * .5); c.moveTo(px + T * .5, py); c.lineTo(px + T * .5, py + T * .5); c.moveTo(px + T * .25, py + T * .5); c.lineTo(px + T * .25, py + T); c.moveTo(px + T * .75, py + T * .5); c.lineTo(px + T * .75, py + T); c.stroke();
  }
  // 바닥
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++){
    const px = ox + x * T, py = oy + y * T;
    c.fillStyle = ((x + y) % 2) ? '#e8b77f' : '#efc18c'; c.fillRect(px, py, T, T);
    c.strokeStyle = 'rgba(150,95,45,.35)'; c.lineWidth = 1.2;
    c.beginPath(); c.moveTo(px, py + T / 3); c.lineTo(px + T, py + T / 3); c.moveTo(px, py + 2 * T / 3); c.lineTo(px + T, py + 2 * T / 3);
    const off = ((x * 7 + y * 3) % 3) * T / 3; c.moveTo(px + off, py); c.lineTo(px + off, py + T / 3); c.moveTo(px + (off + T / 2) % T, py + T / 3); c.lineTo(px + (off + T / 2) % T, py + 2 * T / 3); c.stroke();
  }
  // 벽
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (MAP[y][x] === '#') drawWall(c, x, y);
  // 차양
  const aw = oy + T * .62;
  for (let i = 0; i < COLS * 2; i++){
    const px = ox + i * T / 2;
    c.fillStyle = (i % 2) ? '#fff4e0' : '#e8503a';
    c.beginPath(); c.moveTo(px, oy - T * .3); c.lineTo(px + T / 2, oy - T * .3); c.lineTo(px + T / 2, aw); c.arc(px + T / 4, aw, T / 4, 0, Math.PI); c.closePath(); c.fill();
  }
  c.strokeStyle = OUT; c.lineWidth = 2.5; c.strokeRect(ox, oy - T * .3, COLS * T, T * .92);
  // 간판
  const sw = T * 3.6, sx = ox + COLS * T / 2 - sw / 2;
  c.lineWidth = 3; rr(c, sx, oy - T * .58, sw, T * .56, 10); fs(c, '#7a4a2a');
  c.fillStyle = '#fff4d6'; c.font = `${Math.round(T * .36)}px Jua, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText('뚝딱 분식', sx + sw / 2, oy - T * .29);
  // 가구
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++){ const s = st[y][x]; if (s) drawStationStatic(c, s); }
}
function drawWall(c, x, y){
  const px = ox + x * T, py = oy + y * T;
  if (y === ROWS - 1){
    c.fillStyle = '#9a6a43'; c.fillRect(px, py, T, T);
    c.fillStyle = '#7f5534'; for (let i = 0; i < 3; i++) c.fillRect(px + 2, py + i * T / 3 + T / 3 - 3, T - 4, 3);
    c.fillStyle = '#b5845a'; c.fillRect(px, py, T, 5);
  } else {
    c.fillStyle = '#8a5a36'; c.fillRect(px, py, T, T);
    c.fillStyle = '#74492a'; for (let i = 1; i < 4; i++) c.fillRect(px + i * T / 4 - 1, py, 2, T);
  }
}
function topRect(s){ const px = ox + s.x * T, py = oy + s.y * T; return {x: px + 1, y: py - T * .14, w: T - 2, h: T * .82, fy: py + T * .68}; }
function drawCounterBody(c, s, top, front){
  const r = topRect(s);
  c.lineWidth = 2.5; c.strokeStyle = OUT;
  rr(c, r.x, r.fy - 2, r.w, oy + s.y * T + T - r.fy + 1, 4); fs(c, front || '#b5703f');
  rr(c, r.x, r.y, r.w, r.h, 7); fs(c, top || '#f6dfb6');
  c.fillStyle = 'rgba(255,255,255,.35)'; c.fillRect(r.x + 5, r.y + 4, r.w - 10, 3);
}
function drawStationStatic(c, s){
  const r = topRect(s), cx = r.x + r.w / 2, cy = r.y + r.h / 2;
  switch (s.type){
    case 'counter': drawCounterBody(c, s); break;
    case 'serve':
      drawCounterBody(c, s, '#ffe9a8', '#c98a3f');
      c.save(); c.translate(cx + T * .26, r.y + T * .22); c.lineWidth = 2;
      c.beginPath(); c.arc(0, 0, T * .1, Math.PI, 0); c.lineTo(T * .12, 2); c.lineTo(-T * .12, 2); c.closePath(); fs(c, '#f2c230'); c.restore();
      c.fillStyle = '#c98a3f'; c.font = `${Math.round(T * .2)}px Jua, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('내는 곳', cx - T * .08, cy + T * .1);
      break;
    case 'board':
      drawCounterBody(c, s);
      c.lineWidth = 2.2; rr(c, cx - T * .34, cy - T * .26, T * .68, T * .5, 8); fs(c, '#d9a066');
      c.strokeStyle = 'rgba(120,70,30,.4)'; c.beginPath(); c.moveTo(cx - T * .25, cy - T * .05); c.lineTo(cx + T * .2, cy - T * .05); c.stroke();
      break;
    case 'stove':
      drawCounterBody(c, s, '#4d4f57', '#33343a');
      c.strokeStyle = '#8b8e98'; c.lineWidth = 3; c.beginPath(); c.arc(cx, cy, T * .28, 0, 7); c.stroke(); c.beginPath(); c.arc(cx, cy, T * .16, 0, 7); c.stroke();
      break;
    case 'trash':
      c.lineWidth = 2.5; c.strokeStyle = OUT;
      rr(c, r.x + T * .16, r.y + T * .1, r.w - T * .32, T * .86, 8); fs(c, '#5fae5a');
      rr(c, r.x + T * .1, r.y + T * .02, r.w - T * .2, T * .18, 6); fs(c, '#3f8d3c');
      c.fillStyle = '#fff'; c.font = `${Math.round(T * .2)}px Jua, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('버리기', cx, r.y + T * .55);
      break;
    case 'plates':
      drawCounterBody(c, s);
      for (let i = 0; i < 4; i++){ c.lineWidth = 2; c.strokeStyle = OUT; c.beginPath(); c.ellipse(cx, cy + T * .1 - i * T * .07, T * .3, T * .13, 0, 0, 7); c.fillStyle = '#fdfdfd'; c.fill(); c.stroke(); }
      break;
    case 'box':
      c.lineWidth = 2.5; c.strokeStyle = OUT;
      rr(c, r.x + 2, r.fy - 2, r.w - 4, oy + s.y * T + T - r.fy + 1, 4); fs(c, '#a9693a');
      rr(c, r.x + 2, r.y, r.w - 4, r.h, 6); fs(c, '#d7955a');
      c.strokeStyle = 'rgba(110,60,25,.45)'; c.lineWidth = 2; c.beginPath(); c.moveTo(r.x + 6, r.y + r.h * .5); c.lineTo(r.x + r.w - 6, r.y + r.h * .5); c.stroke();
      c.fillStyle = '#fff8ea'; c.beginPath(); c.arc(cx, r.y + r.h * .4, T * .26, 0, 7); c.fill(); c.lineWidth = 2; c.strokeStyle = OUT; c.stroke();
      icon(c, s.ing, false, cx, r.y + r.h * .4, T * .42);
      c.font = `${Math.round(T * .18)}px Jua, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
      { const name = ING[s.ing].name.replace('고추장 ', ''), tw = c.measureText(name).width + T * .14;
        c.lineWidth = 1.6; rr(c, cx - tw / 2, r.y + r.h * .76, tw, T * .22, T * .08); fs(c, '#fff8ea');
        c.fillStyle = OUT; c.fillText(name, cx, r.y + r.h * .76 + T * .115); }
      break;
  }
}

// ---------- 매 프레임 그리기 ----------
function draw(){
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(bg, 0, 0);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (!player) return;

  // 가구 위 물건
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++){
    const s = st[y][x]; if (!s) continue;
    const r = topRect(s), cx = r.x + r.w / 2, cy = r.y + r.h / 2;
    if (s === target && running){
      const pulse = .55 + Math.sin(now * 7) * .25;
      ctx.save(); ctx.lineWidth = 4; ctx.strokeStyle = `rgba(255,255,255,${pulse})`; rr(ctx, r.x + 2, r.y + 2, r.w - 4, r.h - 4, 8); ctx.stroke(); ctx.restore();
    }
    if (s.flash > 0){ ctx.save(); ctx.globalAlpha = s.flash * 2; ctx.fillStyle = '#fff'; rr(ctx, r.x, r.y, r.w, r.h, 7); ctx.fill(); ctx.restore(); }
    if (s.type === 'counter') drawItem(ctx, s.item, cx, cy - T * .02, T * .72);
    else if (s.type === 'board'){
      const n = s.items.length;
      if (n === 1) drawItem(ctx, s.items[0], cx, cy - T * .02, T * .7);
      else s.items.forEach((it, i) => drawItem(ctx, it, cx + ((i % 2) - .5) * T * .34, cy + (Math.floor(i / 2) - .5) * T * .26 - T * .02, T * .42));
      if (s.progress > 0) bar(cx, r.y - T * .04, s.progress, '#3fae49');
      if (workType(s) && running) hintBubble(cx, r.y - T * .12, workType(s) === 'chop' ? '썰기' : '말기');
    } else if (s.type === 'stove') drawPot(s, cx, cy);
  }

  // 손님
  for (const o of orders) drawCustomer(o);

  // 요리사
  for (const p of players) if (p !== player) drawChef(ctx, p);
  drawChef(ctx, player);
  if (players.length > 1){
    ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = `${Math.round(T * .24)}px Jua, sans-serif`; ctx.lineWidth = 4; ctx.strokeStyle = '#fff';
    for (const p of players){ const nx = ox + p.x * T, ny = oy + p.y * T - T * 1.12; ctx.strokeText(p.name, nx, ny); ctx.fillStyle = p.color; ctx.fillText(p.name, nx, ny); }
    ctx.restore();
  }

  // 입자
  for (const p of parts){
    const a = Math.max(0, p.life / p.max), px = ox + p.x * T, py = oy + p.y * T, sz = p.size * T;
    ctx.save(); ctx.globalAlpha = p.kind === 'steam' || p.kind === 'smoke' ? a * .55 : a;
    ctx.fillStyle = p.color;
    if (p.kind === 'heart') heart(ctx, px, py, sz);
    else if (p.kind === 'star') star(ctx, px, py, sz);
    else { ctx.beginPath(); ctx.arc(px, py, p.kind === 'chip' ? sz : sz * (1.6 - a * .6), 0, 7); ctx.fill(); }
    ctx.restore();
  }
  // 떠오르는 글
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const f of floats){
    ctx.save(); ctx.globalAlpha = Math.min(1, f.life * 1.6);
    ctx.font = `${Math.round(T * .3)}px Jua, sans-serif`; ctx.lineWidth = 5; ctx.strokeStyle = '#fff';
    ctx.strokeText(f.text, ox + f.x * T, oy + f.y * T); ctx.fillStyle = f.color; ctx.fillText(f.text, ox + f.x * T, oy + f.y * T);
    ctx.restore();
  }
  drawHud();
  if (tut) tut.draw(ctx, performance.now() / 1000);   // 연습 화살표·반짝이
  drawJoy();
  if (toast){
    ctx.save(); ctx.globalAlpha = Math.min(1, toast.t);
    ctx.font = `${Math.round(Math.max(16, T * .3))}px Jua, sans-serif`;
    const tw = ctx.measureText(toast.text).width + 40, tx = W / 2 - tw / 2, ty = oy + ROWS * T * .48;
    ctx.lineWidth = 3; ctx.strokeStyle = OUT; rr(ctx, tx, ty, tw, T * .62, 16); fs(ctx, '#fff8ea');
    ctx.fillStyle = OUT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(toast.text, W / 2, ty + T * .31);
    ctx.restore();
  }
}
function bar(cx, y, v, col){
  const w = T * .7, h = T * .13;
  ctx.save(); ctx.lineWidth = 2; ctx.strokeStyle = OUT; rr(ctx, cx - w / 2, y - h / 2, w, h, h / 2); fs(ctx, '#fff');
  if (v > 0){ rr(ctx, cx - w / 2 + 2, y - h / 2 + 2, Math.max(h - 4, (w - 4) * Math.min(1, v)), h - 4, (h - 4) / 2); ctx.fillStyle = col; ctx.fill(); }
  ctx.restore();
}
function hintBubble(cx, y, text){
  const bob = Math.sin(now * 5) * T * .03;
  ctx.save(); ctx.font = `${Math.round(T * .22)}px Jua, sans-serif`;
  const w = ctx.measureText(text).width + T * .36, h = T * .34, x = cx - w / 2, yy = y - h + bob;
  ctx.lineWidth = 2; ctx.strokeStyle = OUT; rr(ctx, x, yy - h * .4, w, h, h / 2); fs(ctx, '#3fae49');
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, cx, yy - h * .4 + h / 2 + 1);
  ctx.restore();
}
function drawPot(s, cx, cy){
  const pot = s.pot, w = T * .66, h = T * .44, y = cy - T * .02;
  ctx.save(); ctx.lineWidth = 2.5; ctx.strokeStyle = OUT;
  rr(ctx, cx - w / 2 - T * .09, y - h * .2, T * .12, T * .1, 3); fs(ctx, '#5a5d66');

function sfx(type){
  if (net.mode === 'host') netEv(['s', type]);
  if (!AC || muted) return;
  const tones = {pick:[[620,.07,'triangle']], place:[[420,.07,'triangle']], trash:[[220,.12,'triangle']], chop:[[1100,.03,'square']],
    serve:[[660,.12,'sine'],[880,.12,'sine'],[1175,.2,'sine']], bad:[[200,.14,'sawtooth']], done:[[880,.1,'sine'],[1320,.16,'sine']], ding:[[1500,.25,'sine']]};

    const o = AC.createOscillator(), g = AC.createGain();
    o.type = w; o.frequency.value = f; o.connect(g); g.connect(AC.destination);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(type === 'chop' ? .03 : .07, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);

// 방장 기기 한 대가 게임을 계산하고, 친구 기기(최대 3명)는 움직임과 버튼만 보내요.
// 방장 기기가 받은 결과(그릇, 냄비, 주문, 점수)를 1초에 12번 친구들에게 나눠 줘요.
// 연결 서버를 바꾸려면 public/peer-config.js 의 window.PEER_OPTS 를 고쳐요.
const ROOM_PREFIX = 'ddukddak-jangteo-';
const CHEF_COLORS = ['#f07a2e', '#3f8fe0', '#3fae49', '#d6336c'];
const SPAWNS = [[6.5, 4.5], [4.5, 4.5], [8.5, 4.5], [6.5, 2.5]];
const MAX_CHEFS = 4;
const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
const qs = new URLSearchParams(location.search);
function loadName(){ try { return localStorage.getItem('ddukddak_name') || ''; } catch (e){ return ''; } }
function saveName(n){ try { localStorage.setItem('ddukddak_name', n); } catch (e){} }
const net = {mode:'solo', peer:null, conns:{}, host:null, code:'', myId:'me', myCi:0, lobby:[], list:[], ev:[],
  sendT:0, snapT:0, seq:0, lastSnap:0, timer:null, screen:null,
  name:(qs.get('name') || loadName() || '요리사').trim().slice(0, 8) || '요리사'};
const peerOpts = () => Object.assign({}, window.PEER_OPTS || {});
const r2 = v => Math.round(v * 100) / 100;
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[c]));
function netEv(e){ if (net.ev.length < 80) net.ev.push(e); }
function makeChef(id, name, ci, x, y){
  return {id, name, ci, color:CHEF_COLORS[ci % CHEF_COLORS.length], x, y, tx:x, ty:y, dir:{x:0, y:1}, hold:null,
    walkT:0, moving:false, pop:0, working:false, holdB:false, workS:null, target:null, chopSnd:0};
}
function initAudio(){
  try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch (err) { AC = null; }
}
function hostSend(msg){
  for (const id in net.conns){ const c = net.conns[id]; if (c.open){ try { c.send(msg); } catch (e){} } }
}
function lobbyList(){ return net.mode === 'host' ? [{id:net.myId, name:net.name, ci:0}].concat(net.lobby) : net.list; }

// --- 방장 → 친구: 화면 상태 ---
function makeSnap(){
  return {t:'s', tl:r2(timeLeft), sv:served, cn:coins,
    P: players.map(p => {
      const me = p === player;
      return [p.id, r2(me ? p.x : p.tx), r2(me ? p.y : p.ty), r2(p.dir.x), r2(p.dir.y), p.moving ? 1 : 0, p.working ? 1 : 0, p.hold, p.ci, p.name, r2(p.pop)];
    }),
    S: dynList.map(s => s.type === 'counter' ? [s.item, r2(s.flash)]
      : s.type === 'board' ? [s.items, r2(s.progress), r2(s.flash)]
      : s.type === 'stove' ? [s.pot.items, s.pot.state, r2(s.pot.cook), r2(s.pot.doneT), r2(s.flash)]
      : [r2(s.flash)]),
    O: orders.map(o => [o.id, o.rid, o.col, r2(o.t), o.leaving ? 1 : 0, o.served ? 1 : 0, r2(o.out), o.animal, o.q ? 1 : 0]),
    T: toast ? [toast.text, r2(toast.t)] : null,
    E: net.ev.splice(0)};
}
function applySnap(d){
  net.lastSnap = performance.now();
  timeLeft = d.tl; served = d.sv; coins = d.cn;
  const seen = {};
  for (const [id, x, y, dx, dy, mv, wk, hold, ci, name, pop] of d.P){
    seen[id] = 1;
    if (id === net.myId){ player.hold = hold; if (pop > player.pop) player.pop = pop; continue; }
    let p = players.find(q => q.id === id);
    if (!p){ p = makeChef(id, name, ci, x, y); players.push(p); }
    p.tx = x; p.ty = y; p.dir = {x:dx, y:dy}; p.moving = !!mv; p.working = !!wk; p.hold = hold; p.pop = Math.max(p.pop, pop);
  }
  players = players.filter(p => p === player || seen[p.id]);
  d.S.forEach((a, i) => {
    const s = dynList[i]; if (!s) return;
    if (s.type === 'counter'){ s.item = a[0]; s.flash = Math.max(s.flash, a[1]); }
    else if (s.type === 'board'){ s.items = a[0]; s.progress = a[1]; s.flash = Math.max(s.flash, a[2]); }
    else if (s.type === 'stove'){ s.pot.items = a[0]; s.pot.state = a[1]; s.pot.cook = a[2]; s.pot.doneT = a[3]; s.flash = Math.max(s.flash, a[4]); }
    else s.flash = Math.max(s.flash, a[0]);
  });
  const old = {}; for (const o of orders) old[o.id] = o;
  orders = d.O.map(a => Object.assign(old[a[0]] || {anim:0}, {id:a[0], rid:a[1], col:a[2], t:a[3], leaving:!!a[4], served:!!a[5], out:a[6], animal:a[7], q:!!a[8]}));
  if (d.T && (!toast || toast.text !== d.T[0])) toast = {text:d.T[0], t:d.T[1]};
  for (const e of d.E || []){
    if (e[0] === 's') sfx(e[1]);
    else if (e[0] === 'f') addFloat(e[1], e[2], e[3], e[4]);
    else if (e[0] === 'b') burst(e[1], e[2], e[3], e[4], e[5]);
  }
}

// ---------- 가게 셈 문제(결과 화면, 한 판에 한 문제) ----------
// 2026-11-25 선생님: 학년에 맞는 배움 한 가지. 요리 흐름·친구 동기화를 끊지 않게 결과 화면에서만, 맞히면 이 기기에서만 +3 코인(보여 주기만).
// 1학년 20까지 더하기 · 2학년 두 자리 덧셈·뺄셈 · 3학년 값 × 개수 · 4학년 나눗셈·큰 수 곱셈 · 5학년 평균·분수만큼 · 6학년 할인(백분율)·비례배분. 답은 코드가 계산.
function makeMathQ(g){
  const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1)), pick = L => L[Math.floor(Math.random() * L.length)];
  const fmt = n => n.toLocaleString('ko-KR');
  let q, a, unit = '코인', near = [1, 2, 10], extra = [];
  if (g <= 1){
    const x = ri(2, 9), y = ri(2, Math.min(9, 20 - x)); a = x + y;
    q = `주먹밥은 ${x}코인, 떡볶이는 ${y}코인이에요. 둘 다 사면 모두 몇 코인일까요?`; near = [1, 2, 3];
  } else if (g === 2){
    if (Math.random() < .5){ const x = ri(15, 68), y = ri(12, 99 - x); a = x + y; q = `오전에 ${x}코인, 오후에 ${y}코인을 벌었어요. 모두 몇 코인일까요?`; }
    else { const x = ri(41, 99), y = ri(12, x - 11); a = x - y; q = `코인 ${x}개 중에서 ${y}개로 재료를 샀어요. 남은 코인은 몇 개일까요?`; unit = '개'; }
  } else if (g === 3){
    const p = ri(12, 48), n = ri(2, 6); a = p * n; near = [p, 10, 1];
    q = `김밥 한 줄에 ${p}코인이에요. ${n}줄을 팔면 모두 몇 코인일까요?`;
  } else if (g === 4){
    if (Math.random() < .5){ const d = pick([12, 14, 15, 16, 18, 24, 25]), n = ri(8, 32); a = n; unit = '상자'; near = [1, 2, 3];
      q = `떡볶이 떡 ${fmt(d * n)}개를 한 상자에 ${d}개씩 담으면 몇 상자가 될까요?`; }
    else { const p = pick([150, 250, 350, 450, 120, 240]), n = ri(12, 40); a = p * n; unit = '원'; near = [p, 100, 1000];
      q = `어묵 한 개에 ${fmt(p)}원이에요. ${n}개를 팔면 모두 몇 원일까요?`; }
  } else if (g === 5){
    if (Math.random() < .5){ const m = ri(20, 40), x = m + ri(-9, 9), y = m + ri(-9, 9), z = 3 * m - x - y; a = m; near = [1, 2, 3];
      q = `3일 동안 번 코인이 ${x}개, ${y}개, ${z}개예요. 하루에 평균 몇 개를 벌었을까요?`; unit = '개'; }
    else { const den = pick([3, 4, 5, 6, 8]), num = ri(2, den - 1), k = ri(3, 9), N = den * k; a = num * k; unit = '개'; near = [k, 1, 2];
      q = `오늘 번 코인 ${N}개의 ${num}/${den}로 재료를 샀어요. 재료에 쓴 코인은 몇 개일까요?`; }
  } else {
    if (Math.random() < .6){ const p = pick([2000, 3000, 4000, 5000, 6000, 8000]), r = pick([10, 20, 25, 30, 40, 50]); a = p * (100 - r) / 100; unit = '원';
      q = `${fmt(p)}원짜리 떡볶이를 ${r}% 할인해서 팔아요. 얼마에 살 수 있을까요?`; near = [500, 100, 1000];
      extra = [p * r / 100, p - r * 10]; }   // 자주 하는 실수: 할인한 금액만 · %를 그냥 빼기
    else { const [x, y] = pick([[3, 2], [2, 3], [3, 1], [1, 3], [4, 1], [3, 4], [2, 5]]), k = ri(3, 8), N = (x + y) * k; a = x * k; unit = '그릇'; near = [k, 1, 2];
      q = `김밥과 떡볶이를 ${x} : ${y}로 팔았어요. 모두 ${N}그릇이면 김밥은 몇 그릇일까요?`; }
  }
  // 틀린 보기: 자주 하는 실수(extra) 먼저, 나머지는 정답 ± 가까운 수 중에서 무작위(정답이 늘 같은 자리에 오지 않게)
  const pool = [];
  for (const d of near) for (const m of [1, 2]) pool.push(a + d * m, a - d * m);
  for (let i = pool.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  const set = new Set([a]);
  for (const v of [...extra, ...pool]) if (set.size < 4 && v > 0 && Number.isInteger(v)) set.add(v);
  for (let v = a + 1; set.size < 4; v++) set.add(v);
  const ch = [...set];
  for (let i = 3; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [ch[i], ch[j]] = [ch[j], ch[i]]; }   // 정답 자리를 고르게 섞기
  return {q, a, unit, ch, text: n => fmt(n) + unit};
}
function showMathQ(){   // 결과 화면에 한 문제. 내 학년(친구랑 해도 셈 문제는 내 학년) · 한 번만 고를 수 있음
  const box = document.getElementById('mathQ'); if (!box) return;
  const g = localGrade(), m = makeMathQ(g);
  box.innerHTML = `<p><b>🧮 ${g}학년 가게 셈</b> ${m.q}</p><div class="ch">${m.ch.map(v => `<button data-v="${v}">${m.text(v)}</button>`).join('')}</div><div class="res">맞히면 +3 코인!</div>`;
  box.classList.toggle('big', g <= 2); box.classList.remove('hide');
  let done = false;

    if (!ok) b.classList.add('no');
    box.querySelector('.res').textContent = ok ? '정답! 가게 금고에 +3 코인' : `아쉬워요! 정답은 ${m.text(m.a)}`;
    if (ok) document.getElementById('sCoin').textContent = coins + 3;   // 이 기기 화면에만(친구 판·광장 기록은 그대로)
    if (net.mode !== 'host') sfx(ok ? 'serve' : 'bad');   // 방장 기기의 소리는 친구에게도 가므로 내지 않음
  });
}

function makeRoom(){
  netReset();
  net.mode = 'host'; net.myId = 'h'; net.myCi = 0; net.lobby = []; net.seq = 0;
  setMsg('방을 만드는 중이에요…');
  openHostPeer(0);
}
function openHostPeer(tries){
  const code = Array.from({length:4}, () => CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]).join('');
  let peer;
  try { peer = new Peer(ROOM_PREFIX + code, peerOpts()); }
  catch (e){ netReset(); renderMenu('이 기기에서는 친구 연결을 쓸 수 없어요'); return; }
  net.peer = peer; net.code = code;
  let opened = false;
  peer.on('open', () => { if (net.peer !== peer) return; opened = true; renderHostLobby(); });
  peer.on('connection', conn => onGuestConn(conn));
  peer.on('disconnected', () => {
    // 연결 서버와 끊겨도 이미 들어온 친구와는 계속 이어져 있어요. 새 친구를 받으려고 다시 붙어요.
    setTimeout(() => { try { if (net.peer === peer && !peer.destroyed && peer.disconnected) peer.reconnect(); } catch (e){} }, 1500);
  });
  peer.on('error', err => {

function joinRoom(code){
  code = String(code || '').toUpperCase().replace(/[^A-Z]/g, '');
  if (code.length !== 4){ setMsg('코드 4글자를 적어요'); return; }
  netReset();
  net.mode = 'guest'; net.code = code;
  setMsg('들어가는 중이에요…');
  let peer;
  try { peer = new Peer(undefined, peerOpts()); }
  catch (e){ netReset(); renderJoin('이 기기에서는 친구 연결을 쓸 수 없어요', code); return; }
  net.peer = peer;
  let welcomed = false;
  net.timer = setTimeout(() => { if (!welcomed && net.peer === peer){ netReset(); renderJoin('방에 들어가지 못했어요. 코드를 확인하고 다시 해 봐요', code); } }, 12000);
  peer.on('open', () => {
    if (net.peer !== peer) return;
    const conn = peer.connect(ROOM_PREFIX + code, {reliable:true, serialization:'json', metadata:{name:net.name}});
    net.host = conn;
    conn.on('data', d => { if (net.host !== conn) return; if (d && d.t === 'welcome') welcomed = true; guestRecv(d); });
    conn.on('close', () => { if (net.host === conn) hostLost('방장과 연결이 끊겼어요. 방장 기기를 확인하고 다시 들어와요'); });
    conn.on('error', () => { if (net.host === conn) hostLost('방장과 연결이 끊겼어요. 방장 기기를 확인하고 다시 들어와요'); });
  });
  peer.on('error', err => {
    if (net.peer !== peer) return;
    if (err && err.type === 'peer-unavailable'){ netReset(); renderJoin('그 코드의 방을 찾지 못했어요. 코드를 다시 확인해 봐요', code); }
    else if (!welcomed){ netReset(); renderJoin('친구 연결 서버에 닿지 못했어요. 인터넷을 확인하고 다시 해 봐요', code); }
  });
}
function guestRecv(d){
  if (!d || net.mode !== 'guest') return;
  switch (d.t){
    case 'welcome': net.myId = d.id; net.myCi = d.ci; clearTimeout(net.timer); renderWait(); break;
    case 'lobby': net.list = d.list || []; if (net.screen === 'wait') renderWait(); break;
    case 'full': { const code = net.code; netReset(); renderJoin(d.why === 'busy' ? '지금 게임 중이에요. 한 판이 끝나면 다시 들어와요' : '방이 꽉 찼어요 (최대 4명)', code); break; }
    case 'start': guestStart(d); break;
    case 's': if (running) applySnap(d); break;
    case 'end': guestEnd(d); break;
    case 'ask': quizAsk(d.rid).then(r => { if (r && !r.skipped && r.correct && net.host && net.host.open) try { net.host.send({t: 'qr', k: d.k, f: r.first ? 1 : 0}); } catch (e){} }); break;   // 문제 손님(방장 학년 문제)
    case 'wait': running = false; hide('endOv'); renderWait(); break;
    case 'bye': hostLost('방장이 방을 닫았어요'); break;
  }
}
function hostLost(msg){
  if (net.mode !== 'guest') return;

  function lit(b){   // 따라 하기: 그 단계에 누를 단추만 밝게(작업 단추 = 썰기·말기·설거지, 아니면 잡기 단추)
    const A = document.getElementById('btnA'), B = document.getElementById('btnB');
    if (A) A.classList.toggle('tutLit', T && T.phase === 'practice' && !b);
    if (B) B.classList.toggle('tutLit', T && T.phase === 'practice' && !!b);
  }
  skipB.onclick = () => { if (T && canSkip()) finish(true); };

  // ---------- 상태 보는 도우미 ----------
  const P = () => api.player(), H = () => P().hold;
  const S = () => api.stations().filter(s => !s.hid);
  const one = t => S().find(s => s.type === t);
  const all = t => S().filter(s => s.type === t);
  const isIng = (h, id, cut) => !!h && h.t === 'ing' && h.id === id && (cut === undefined || !!h.cut === cut);
  const box = ing => S().find(s => s.type === 'box' && s.ing === ing);
  const plateWith = (h, rid) => !!h && h.t === 'plate' && h.c.length === 1 && h.c[0].t === 'dish' && h.c[0].id === rid;
  const emptyPlate = h => !!h && h.t === 'plate' && !h.c.length;
  const orderOf = rid => api.orders().find(o => o.rid === rid && !o.served && !o.leaving);
  const serveFor = rid => { const o = orderOf(rid); return o ? S().find(s => s.type === 'serve' && s.x === o.col) : null; };
  const boardWith = f => all('board').find(b => b.items.some(f));
  const emptyBoard = () => all('board').find(b => !b.items.length);
  const usedPot = () => { const L = all('stove'); return L.find(s => s.pot.items.length || s.pot.state !== 'idle') || L[0]; };
  function plateSrc(){   // 빈 접시를 가져올 곳: 거치대 → 개수대의 깨끗한 접시 → 조리대에 놓아 둔 빈 접시
    const P = one('plates'); if (P && P.n > 0) return P;

    return all('counter').find(c => c.item && c.item.t === 'plate' && !c.item.c.length) || P;
  }
  const potHas = id => { const p = usedPot(); return !!p && (p.pot.state !== 'idle' || p.pot.items.some(i => i.id === id)); };

  // 지금 할 일 고르기: {t: 글, s: 짧은 글(1~2학년), tgt: 짚을 칸, b: 작업 단추(썰기·말기·설거지) 깜빡, key}
  const step = (key, t, s, tgt, b) => ({key, t, s: s || t, tgt, b: !!b});
  function junk(useful){   // 쓸모없는 것을 들었으면 내려놓게
    const h = H(); if (!h || useful(h)) return null;

  // 떡볶이 냄비: 썬 어묵 · 떡 · 소스
  function potStep(){

    const j = junk(x => isIng(x, 'eomuk') || isIng(x, 'tteok') || isIng(x, 'sauce') || emptyPlate(x)); if (j) return j;

    }

  }
  function washStep(){
    const r = one('ret'), sk = one('sink'), h = H();
    if (h && h.t === 'dirty') return step('sink', '개수대에 넣어요', '개수대에!', sk);
    const j = junk(x => emptyPlate(x)); if (j) return j;
    if (emptyPlate(h)) return step('rack', '깨끗한 접시! 거치대에 놓아요(바로 써도 돼요)', '접시 거치대에!', one('plates'));
    if (sk && sk.n > 0) return step('wash', '설거지해요', '설거지해요', sk, true);
    if (sk && sk.c > 0) return step('clean', '반짝반짝! 깨끗한 접시를 들어요', '깨끗한 접시 들기', sk);
    if (r && r.n > 0) return step('dirty', '더러운 접시를 들어요', '더러운 접시 들기', r);

  }
  // 김밥: 도마 하나(A)에 썬 단무지·썬 시금치·김·밥 → 말기 → 접시에 담아 내기
  function kimbapStep(){
    const o = orderOf('kimbap'); if (!o) return null;
    const h = H();
    if (plateWith(h, 'kimbap')) return step('serve-kimbap', '김밥을 손님에게 서빙해요!', '주문한 손님에게!', serveFor('kimbap'));
    const dishB = boardWith(i => i.t === 'dish' && i.id === 'kimbap');
    if (dishB){
      if (emptyPlate(h)) return step('dish-kimbap', '접시에 김밥을 담아요', '접시에 담아요', dishB);
      const j = junk(() => false); if (j) return j;
      return step('plate-kimbap', '김밥 완성! 접시를 가져와요', '접시 가져오기', plateSrc());
    }
    const boards = all('board');
    const A = boards.find(b => b.items.some(i => i.t === 'ing' && i.cut && (i.id === 'danmuji' || i.id === 'spinach')) && b.items.length > 1) || boardWith(i => isIng(i, 'danmuji', true)) || boardWith(i => isIng(i, 'danmuji')) || boards[0];

    const onA = (id, cut) => A.items.some(i => isIng(i, id, cut));
    // 김밥 도마에 안 들어가는 것(어묵·떡·접시…), 같은 재료 두 개, 썰어야 하는데 다른 재료와 같이 놓인 것 → 도마를 비우고 다시
    const kinds = {}, badA = A.items.some(i => { if (i.t !== 'ing' || !['danmuji', 'spinach', 'gim', 'rice'].includes(i.id)) return true; if (kinds[i.id]) return true; kinds[i.id] = 1; return (i.id === 'danmuji' || i.id === 'spinach') && !i.cut && A.items.length > 1; });

      return step('clearA', '이건 김밥에 안 들어가요. 도마 위의 것을 집어요', '도마 비우기', A);
    }
    const need = [['danmuji', true, '단무지'], ['spinach', true, '시금치'], ['gim', false, '김'], ['rice', false, '밥']].filter(([id, cut]) => !onA(id, cut));
    if (!need.length) return step('roll', '재료가 다 모였어요! 김밥을 말아요', '김밥을 말아요', A, true);
    const [id, cut, nm] = need[0];
    const j = junk(x => (x.t === 'ing' && need.some(n => n[0] === x.id)) || isIng(x, 'danmuji', true) || isIng(x, 'spinach', true)); if (j) return j;

  // ---------- 진행 ----------
  let T = null;   // 지금 하는 연습 {phase:'demo'|'practice'|'end', ...}
  const now = () => performance.now() / 1000;
  function begin(after){
    T = {phase: 'demo', after, t0: now(), i: -1, sub: 0, at: 0, path: null, tries: 0, last: now()};
    api.setup('demo'); api.focus(true);
    document.body.classList.add('tutDemo');
    bar.classList.remove('hide'); skipB.style.display = canSkip() ? '' : 'none';
    tag.textContent = small() ? '👀 보기' : '👀 먼저 보기 · 손대지 않아도 돼요';
  }
  // 보여 주기 대본: go = 걸어가서 누를 칸, say = 말(짧은 말은 s)
  const DEMO = [
    {who: 'sarang', t: '주문 카드를 봐요. 주먹밥이에요!', s: '주먹밥 주문!', card: true, wait: 3.0},
    {who: 'sarang', t: '먼저 접시를 들어요', s: '접시 들기', go: () => one('plates'), check: () => !!H() && H().t === 'plate'},
    {who: 'sarang', t: '밥을 담아요', s: '밥 담기', go: () => box('rice'), check: () => H() && H().c && H().c.some(i => i.id === 'rice')},
    {who: 'sarang', t: '김을 담아요', s: '김 담기', go: () => box('gim'), check: () => H() && H().c && H().c.some(i => i.id === 'gim')},
    {who: 'sarang', t: '참치도 담아요', s: '참치 담기', go: () => box('tuna'), check: () => H() && H().c && H().c.some(i => i.id === 'tuna')},
    {who: 'sarang', t: '손님에게 서빙해요', s: '손님에게!', go: () => serveFor('jumeokbap'), check: () => !orderOf('jumeokbap')},
    {who: 'kong', t: '맛있대요! 이제 {name} 차례예요', s: '이제 해 봐요!', wait: 2.8}
  ];
  function standFor(s){   // 칸 옆 빈자리 중 요리사에게서 가장 가까운 곳(걸음 수로)
    const p = P(), sx = Math.floor(p.x), sy = Math.floor(p.y), key = (x, y) => x + ',' + y;
    const goals = [[1,0],[-1,0],[0,1],[0,-1]].map(([dx, dy]) => [s.x + dx, s.y + dy]).filter(([x, y]) => api.free(x, y));
    const prev = new Map([[key(sx, sy), null]]), q = [[sx, sy]];
    while (q.length){
      const [x, y] = q.shift();
      if (goals.some(([a, b]) => a === x && b === y)){ const path = []; let k = key(x, y), c = [x, y]; while (c){ path.unshift([c[0] + .5, c[1] + .5]); c = prev.get(k); k = c ? key(c[0], c[1]) : null; } return {path, x, y}; }
      for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const nx = x + dx, ny = y + dy; if (!api.free(nx, ny) || prev.has(key(nx, ny))) continue; prev.set(key(nx, ny), [x, y]); q.push([nx, ny]); }
    }
    return goals.length ? {path: [[goals[0][0] + .5, goals[0][1] + .5]], x: goals[0][0], y: goals[0][1]} : null;
  }
  function demoTick(){
    const p = P(), t = now(), rdt = Math.min(0.25, t - T.last); T.last = t;
    const D = DEMO[T.i];
    if (!D || (T.sub === 0 && t >= T.at)){   // 다음 줄
      T.i++; const N = DEMO[T.i];
      if (!N){ startPractice(); return; }
      T.sub = N.go ? 1 : 0; T.at = t + (N.wait || 0); T.tries = 0; T.path = null; T.goT = t; T.tgt = null; T.fast = false;   // 새 줄: 옛 칸 화살표 지우기
      say(N.who, small() ? N.s : N.t, small() ? '' : '보기', DEMO.length, T.i);
      return;
    }
    if (T.sub === 1){   // 걸어가기(진짜 시간: 1초에 2.6칸)
      const s = D.go(); if (!s){ T.sub = 0; T.at = t + 0.5; return; }
      if (!T.path){ const r = standFor(s); T.path = r ? r.path : [[p.x, p.y]]; T.tgt = s; api.focus(true, {x: s.x + .5, y: s.y + .5}); if (t - T.goT < 0.9){ p.moving = false; T.path = null; return; } }
      let move = 2.6 * rdt * (T.fast ? 2.5 : 1);

        const [wx, wy] = T.path[0], dx = wx - p.x, dy = wy - p.y, d = Math.hypot(dx, dy);
        if (d < 1e-3){ T.path.shift(); continue; }
        const m = Math.min(d, move); p.x += dx / d * m; p.y += dy / d * m; move -= m; p.dir = {x: dx / d, y: dy / d};
        if (m >= d) T.path.shift();
      }
      p.moving = T.path.length > 0; p.walkT = (p.walkT || 0) + rdt * (p.moving ? 1 : 0); p.tx = p.x; p.ty = p.y;
      if (!T.path.length){ p.dir = {x: Math.sign(s.x + .5 - p.x) * (Math.abs(s.x + .5 - p.x) > .5 ? 1 : 0), y: Math.sign(s.y + .5 - p.y) * (Math.abs(s.y + .5 - p.y) > .5 ? 1 : 0)}; T.sub = 2; T.at = t + 0.45; }
      return;
    }

      api.pressA();
      if (D.check()){ T.sub = 0; T.at = t + 0.9; return; }

  }
  // 연습: 마당(section)마다 할 일. 1학년은 김밥 주문이 없어서 김밥 연습도 빼요
  function sections(){
    const L = [{key: 'tteok', label: '🍢 떡볶이', setup: () => api.addOrder('tteokbokki', true), step: tteokStep, done: () => !orderOf('tteokbokki') && !api.quizBusy()}];

    if (api.grade() >= 2) L.push({key: 'kimbap', label: '🍙 김밥', setup: () => api.addOrder('kimbap', false), step: kimbapStep, done: () => !orderOf('kimbap') && !api.quizBusy()});

  }
  function startPractice(){

  function nextSection(){
    T.si++; const sec = T.secs[T.si];

    api.tidy(); sec.setup(); T.key = ''; T.cur = null; nextB.style.display = 'none';   // tidy: 도마·냄비·조리대를 비우고 접시는 제자리로(앞 연습의 남은 것이 섞이지 않게)

  }
  function practiceTick(){
    const sec = T.secs[T.si]; if (!sec) return;
    if (sec.done()){ if (!T.doneAt){ T.doneAt = now(); T.cur = null; lit(false); } if (now() - T.doneAt < 1.2 || api.quizBusy()) return; T.doneAt = 0; api.cheer(); nextSection(); return; }   // 문제 손님 카드가 뜰 틈을 두고, 카드가 닫힌 뒤 다음 연습
    T.doneAt = 0;
    const c = sec.step();
    if (!c){ T.cur = null; return; }
    if (c.key !== T.key){ if (T.key) api.ding(); T.key = c.key; T.keyT = now(); }
    const stuck = now() - T.keyT > 45; if ((nextB.style.display !== 'none') !== stuck) nextB.style.display = stuck ? '' : 'none';

    say('sarang', (small() ? c.s : c.t) + (slow && !small() ? ' (반짝이는 곳!)' : ''), small() ? '' : sec.label, T.secs.length, T.si);
    lit(c.b);
  }
  function finish(skipped){
    if (!T) return;
    const after = T.after; T = null;
    setDone(); api.focus(false); lit(false); nextB.style.display = 'none';
    document.body.classList.remove('tutDemo', 'tutPractice'); ov.classList.add('hide'); bar.classList.add('hide'); lastText = ''; lastWho = '';
    api.teardown(skipped);
    if (after) after();
  }
  function abort(){   // '처음으로'로 나감: 끝낸 것으로 치지 않음
    if (!T) return;
    T = null; api.focus(false); lit(false); nextB.style.display = 'none';
    document.body.classList.remove('tutDemo', 'tutPractice'); ov.classList.add('hide'); bar.classList.add('hide'); lastText = ''; lastWho = '';
  }
  function tick(){
    if (!T) return;
    if (T.phase === 'demo') demoTick();
    else if (T.phase === 'practice') practiceTick();
    else if (T.phase === 'end' && now() >= T.at) finish(false);
  }
  // 화살표·반짝이(게임의 2D 그림판 위에): 짚는 칸 위에서 통통 튀는 화살표 + 바닥 빛 고리
  function draw(ctx, t){
    if (!T) return;
    const tg = T.phase === 'demo' ? (T.sub ? T.tgt : null) : T.cur && T.cur.tgt;
    const D = T.phase === 'demo' ? DEMO[T.i] : null;
    const card = D && D.card ? api.cardRect() : null;
    // 화면을 어둡게 하고 할 곳만 동그랗게 밝게(2026-11-25 선생님 그림처럼) — 흐림 효과 없이 가볍게
    const tc = tg ? api.toScreen(tg.x + .5, tg.y + .5, 0.8) : null;
    if (card || tg){
      const Wd = innerWidth, Hd = innerHeight, p = P(), me = api.toScreen(p.x, p.y, 0.6), RU = Math.max(24, api.unit() * .95) * (small() ? 1.15 : 1);
      // 한 겹만(낡은 패드: 화면 전체 반투명을 한 번만 칠함). 구멍마다 '그 구멍 바깥'으로 잘라 두고(잘라 낸 곳이 겹쳐 쌓임) 한 번 칠함 → 구멍끼리 겹쳐도 밝게 합쳐짐
      ctx.save(); ctx.fillStyle = `rgba(0,0,0,${T.phase === 'demo' ? .5 : .58})`;
      const hole = f => { ctx.beginPath(); ctx.rect(0, 0, Wd, Hd); f(); ctx.clip('evenodd'); };
      if (card){ const m = 7; hole(() => ctx.rect(card.x - m, card.y - m, card.w + m * 2, card.h + m * 2)); }
      if (tc) hole(() => { ctx.moveTo(tc.x + RU * 1.6, tc.y); ctx.arc(tc.x, tc.y, RU * 1.6, 0, Math.PI * 2); });
      hole(() => { ctx.moveTo(me.x + RU * 1.05, me.y); ctx.arc(me.x, me.y, RU * 1.05, 0, Math.PI * 2); });   // 내 요리사도 보이게
      ctx.fillRect(0, 0, Wd, Hd); ctx.restore(); ctx.save();
      // 구멍 가장자리: 얇은 금빛 테(흐림 대신 가볍게 '여기!'를 보여 줌)
      if (tc){ ctx.strokeStyle = 'rgba(255,224,120,.85)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(tc.x, tc.y, RU * 1.6, 0, Math.PI * 2); ctx.stroke(); }
      ctx.restore();
    }
    place(tc ? tc.y + Math.max(24, api.unit()) * 1.6 : (card ? null : null));
    if (card) arrow(ctx, card.x + card.w / 2, card.y + card.h + 14 + Math.abs(Math.sin(t * 5)) * 10, true, t);
    if (!tg) return;
    const g = api.toScreen(tg.x + .5, tg.y + .5, 1.0), top = api.toScreen(tg.x + .5, tg.y + .5, 1.75);
    const R = Math.max(18, api.unit() * .62) * (small() ? 1.2 : 1);
    ctx.save();
    ctx.globalAlpha = .55 + Math.sin(t * 6) * .25; ctx.strokeStyle = '#ffd43b'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.ellipse(g.x, g.y, R, R * .55, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
    for (let i = 0; i < 4; i++){ const a = t * 2.2 + i * Math.PI / 2, sx = g.x + Math.cos(a) * R * 1.15, sy = g.y + Math.sin(a) * R * .65; star(ctx, sx, sy, 6 + Math.sin(t * 8 + i) * 2.5); }
    ctx.restore();
    arrow(ctx, top.x, top.y - Math.abs(Math.sin(t * 5)) * 12, false, t, small() ? 1.3 : 1);
  }
  function star(ctx, x, y, r){ ctx.fillStyle = '#fff6b0'; ctx.beginPath(); for (let i = 0; i < 8; i++){ const a = i * Math.PI / 4, rr = i % 2 ? r * .38 : r; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); } ctx.closePath(); ctx.fill(); }
  function arrow(ctx, x, y, up, t, k = 1){   // 끝이 (x, y)를 가리키는 굵은 화살표(up: 위를 가리킴)
    const s = 26 * k, d = up ? -1 : 1;
    ctx.save(); ctx.lineJoin = 'round'; ctx.lineWidth = 5; ctx.strokeStyle = '#3a2414'; ctx.fillStyle = '#ff8a3d';
    ctx.beginPath();
    ctx.moveTo(x, y); ctx.lineTo(x - s * .8, y - d * s * .9); ctx.lineTo(x - s * .32, y - d * s * .9); ctx.lineTo(x - s * .32, y - d * s * 1.8);
    ctx.lineTo(x + s * .32, y - d * s * 1.8); ctx.lineTo(x + s * .32, y - d * s * .9); ctx.lineTo(x + s * .8, y - d * s * .9); ctx.closePath();
    ctx.fill(); ctx.stroke(); ctx.restore();
  }
  return {
    begin, tick, draw, finish, abort, isDone: done, canSkip,
    section(i){ if (T && T.phase === 'practice'){ api.clearOrders(); T.si = i - 1; nextSection(); } },   // 점검용: 그 연습으로 바로
    get active(){ return !!T; },
    get lock(){ return !!T && T.phase === 'demo'; },   // 보여 주는 동안 조이스틱·단추 잠금
    get state(){ return T && {phase: T.phase, i: T.i, sub: T.sub, sec: T.secs ? T.secs[T.si] && T.secs[T.si].key : null, si: T.si, key: T.cur ? T.cur.key : '', text: lastText, tgt: T.cur && T.cur.tgt ? [T.cur.tgt.type, T.cur.tgt.x, T.cur.tgt.y] : null, skip: skipB.style.display !== 'none'}; }
  };
}
function tutClean(){ running = false; orders = []; holdB = holdBkey = false; reset('peace'); running = false; }
function tutAddOrder(rid, q){
  const free = SLOTS.filter(c => !orders.some(o => o.col === c)), col = free.includes(4) ? 4 : free[0] || SLOTS[0];
  orders.push({id: ++orderSeq, rid, col, t: 0, anim: 0, leaving: false, served: false, out: 0, q: !!q, animal: ANIMALS[(orderSeq * 5 + col) % ANIMALS.length]});
  sfx('ding');
}
tut = createTutorial({
  player: () => player, stations: () => dynList, orders: () => orders,
  free: (x, y) => x >= 0 && y >= 0 && x < COLS && y < ROWS && MAP[y][x] === '.',
  grade: () => grade, name: () => net.name && net.name !== '요리사' ? net.name : '요리사님', face: () => null,
  setup(ph){
    if (ph === 'demo'){
      initAudio(); reset('peace'); buildBg(); running = true; paused = false; toast = null;
      hide('titleOv'); hide('endOv'); hide('pauseOv'); hide('netOv');
      document.getElementById('pauseBtn').style.display = '';
      orders = []; tutAddOrder('jumeokbap', false);
    } else {
      orders = []; player.hold = null; toast = null;
      for (const s of dynList){ if (s.type === 'counter') s.item = null; else if (s.type === 'board'){ s.items = []; s.progress = 0; } else if (s.type === 'stove') resetPot(s.pot); }
    }
  },
  addOrder: tutAddOrder, clearOrders(){ orders = []; },
  pressA(){ tutPress = true; try { target = findTarget(player); actionA(); } finally { tutPress = false; } },
  force(i){
    const h = player.hold;
    if (i === 1 && !h) player.hold = {t: 'plate', c: []};
    else if (i >= 2 && i <= 4 && h && h.t === 'plate') h.c.push({t: 'ing', id: ['rice', 'gim', 'tuna'][i - 2], cut: false});
    else if (i === 5){ const o = orders.find(q => q.rid === 'jumeokbap' && !q.served); if (o){ serveOrder(o, player); player.hold = null; } }
  },
  toScreen: (x, y, h) => ({x: ox + x * T, y: oy + y * T - h * T * .45}), unit: () => T, cardRect: () => hudCard0,
  joyBox: () => ({x1: Math.min(70, W * .07) * 2 + 30}),   // 조이스틱 오른쪽 끝: 말풍선이 가리지 않게
  focus(){}, platesComing: () => false, hurryPlates(){},
  quizBusy(){ if (quizPend > 0) return true; try { return !!(window.PLAZA_QUIZ && window.PLAZA_QUIZ.asking && window.PLAZA_QUIZ.asking()); } catch (e){ return false; } },
  tidy(){ for (const s of dynList){ if (s.type === 'counter') s.item = null; else if (s.type === 'board'){ s.items = []; s.progress = 0; } else if (s.type === 'stove') resetPot(s.pot); } },   // 다음 연습 전에 주방 정리
  cheer(){ if (net.mode !== 'host') sfx('serve'); burst(player.x, player.y, 'star', 12, '#ffd43b'); },
  ding(){ if (net.mode !== 'host') sfx('pick'); },
  pulseB(on){ btnB.classList.toggle('tutPulse', !!on); },
  teardown(){ tutClean(); }
});
window.__dd.tut = tut;
function tutBtnSync(){ const b = document.getElementById('tutBtn'); if (b) b.style.display = tut.isDone() ? '' : 'none'; }
document.getElementById('tutBtn').onclick = () => { hide('titleOv'); tut.begin(() => { show('titleOv'); }); };
tutBtnSync();

reset('peace'); running = false;
layout();
(document.fonts && document.fonts.load ? document.fonts.load('20px Jua') : Promise.resolve()).then(() => { buildBg(); }).catch(() => {});
requestAnimationFrame(frame);
})();
